# HeteroAKD (arXiv:2504.07691): дистилляция между разнородными архитектурами.
# Признаки обеих моделей проецируются в пространство классов, таргет
# собирается смесью учителя и ученика по их надёжности (KMM), а пиксели
# взвешиваются по отставанию ученика (KEM).
_target_: src.losses.HeteroAKDLoss

# Тап и ширины стадий — под пару SegFormer-B2 -> timm-U-Net(efficientnet_b0).
# В статье проецируется последняя стадия бэкбона (страйд 32).
layer: taps.stage4
student_channels: 320
teacher_channels: 512
num_classes: ${data.dataset.num_classes}

temperature: 4.0
ce_weight: 1.0
# Обычная попиксельная KD по логитам; в статье её вес 0.1.
kd_weight: 0.1
# В статье lambda_2 = 1.0 или 10.0 в зависимости от пары моделей.
hakd_weight: 1.0
# Супервизия проекторов разметкой: без неё «пространство логитов» ничем
# не закреплено за классами, а проектор учителя вовсе не получает градиента.
proj_weight: 1.0

ignore_index: ${data.dataset.ignore_index}
label_smoothing: 0.0
