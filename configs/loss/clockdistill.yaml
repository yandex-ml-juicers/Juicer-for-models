_target_: src.losses.CLoCKDistillLoss

num_classes: 8

# Лишний "model." в начале — обёртка LwDetrCLoCKDistillMemory сама держит
# исходную модель как self.model (см. её докстринг).
student_feature_key: model.21
teacher_feature_key: model.model.backbone.projector

student_channels: 256
teacher_channels: 256
d_model: 256

lambda_det: 1.0
lambda_lcmd: 1.0
lambda_tcld: 1.0

# Веса статьи для полноразмерного multi-scale encoder memory — здесь
# memory урезан до одного уровня (см. докстринг лосса), возможно потребуют
# переподбора.
alpha: 5.0e-5
beta: 1.0e-7

lambda_cls: 1.0
lambda_l1: 5.0
lambda_giou: 2.0

temperature: 2.0

teacher_has_no_object: false

max_target_queries: 300

eps: 1.0e-6
