# BPKD — Boundary Privileged KD (arXiv:2306.08075, WACV 2024).
# total = ce_weight*CE + edge_weight*L_edge + body_weight*L_body,
# где граница берётся морфологической разностью по разметке, L_edge — KL
# по классам в каждой граничной точке, а L_body — канальная KL (как в CWD),
# из которой граничные пиксели исключены.
_target_: src.losses.BPKDLoss

temperature: 4.0
ce_weight: 1.0

# Веса подобраны так, чтобы каждое слагаемое было сопоставимо со своим
# «прародителем»: edge — с alpha у pixel-KD, body — с cwd_weight у CWD.
# В статье стоят 50 и 20, но там другая нормировка (суммы по всему кадру
# вместо средних), поэтому переносить те числа сюда напрямую нельзя.
edge_weight: 3.0
body_weight: 3.0

# Ширина граничной полосы в пикселях (в статье 7).
edge_width: 7

# Прореживание пикселей перед подсчётом. BPKD держит вдвое больше
# полноразмерных тензоров, чем CWD, а на кропе 512x1024 каждый — сотни
# мегабайт. 2 режет память вчетверо; полоса шириной 7 это переживает.
spatial_stride: 2

ignore_index: ${data.dataset.ignore_index}
label_smoothing: 0.0
