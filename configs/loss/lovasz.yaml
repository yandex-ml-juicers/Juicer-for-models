# Lovász-Softmax (arXiv:1705.08790): выпуклое расширение (1 - IoU), то есть
# прямая оптимизация метрики. Идёт слагаемым к CE — чистый Lovász с нуля
# обучается плохо.
_target_: src.losses.LovaszSoftmax

ce_weight: 1.0
lovasz_weight: 1.0

# Прореживание пикселей перед сортировкой: Lovász сортирует ВСЕ пиксели по
# каждому классу, и на кропе 512x1024 это самая дорогая часть шага.
# 2 — вчетверо меньше элементов, оценка Jaccard от этого не меняется.
pixel_stride: 2

ignore_index: ${data.dataset.ignore_index}
label_smoothing: 0.0
