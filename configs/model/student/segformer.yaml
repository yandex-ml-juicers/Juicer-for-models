# SegFormer (Xie et al., NeurIPS 2021) в слоте ученика — используется для
# обучения самих учителей (эксперименты scratch SegFormer-B2 / B5).
_target_: src.models.factory.segformer_for_segmentation
variant: b2             # b0 | b1 | b2 | b3 | b4 | b5

num_classes: ${data.dataset.num_classes}

# null       — случайная инициализация целиком;
# imagenet   — энкодер MiT с ImageNet (nvidia/mit-b*), голова декодера случайна;
# cityscapes — готовая дообученная nvidia/segformer-*-finetuned-cityscapes.
pretrained: imagenet

align_corners: false

# Регуляризация внутри модели. null — оставить дефолт transformers.
# Stochastic depth у SegFormer встроен и включён по умолчанию (0.1), так что
# это не «добавить регуляризацию», а «управлять ею из конфига».
# Для B4/B5 и длинных расписаний имеет смысл поднимать до 0.2-0.3.
drop_path_rate: null            # дефолт SegformerConfig — 0.1
classifier_dropout_prob: null   # dropout перед головой декодера, дефолт 0.1

# Чекпоинт нашего тренера (ключ student_state); при заданном checkpoint_path
# pretrained игнорируется.
checkpoint_path: null

# Веса Hugging Face кладутся в <weights_dir>/huggingface.
weights_dir: data/weights
