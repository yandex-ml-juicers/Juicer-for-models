# @package _global_
defaults:
  - override /data/dataset: imagenet100
  - override /data/transform/train: imagenet_transform
  - override /data/transform/eval: imagenet_transform
  - override /model/teacher: null
  - override /model/student: shufflenet_v2_x1_0
  - override /loss: ce
  - override /optimizer: SGD
  - override /scheduler: warmup_cosine

name: imagenet100_shufflenet_scratch
device: cuda
deterministic: false

clearml:
  enabled: True
  tags: [imagenet-100, baseline, scratch, shuffleNet v2 x1.0]
  output_uri: false

trainer:
  epochs: 200
  amp: true

optimizer:
  lr: 0.2
  momentum: 0.9
  weight_decay: 4.0e-5
  nesterov: true

scheduler:
  warmup_epochs: 5
  start_factor: 0.01
  end_factor: 1.0
  eta_min: 1.0e-5

loss:
  label_smoothing: 0.1

data:
  loader:
    batch_size: 256
    num_workers: 32
    persistent_workers: true