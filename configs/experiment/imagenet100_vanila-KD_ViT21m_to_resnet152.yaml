# @package _global_
defaults:
  - override /data/dataset: imagenet100
  - override /model/teacher: ViT21m
  - override /model/student: resnet152_imagenet
  - override /loss: hinton_kd
  - override /optimizer: adamw
  - override /scheduler: warmup_cosine

name: imagenet100_vanila-KD_ViT21m_to_resnet152
device: cuda
deterministic: False

clearml:
  enabled: True
  tags: [imagenet-100, ViT21m, resnet152]
  reuse_last_task_id: True

trainer:
  epochs: 60
  amp: true
  grad_clip_norm: 1.0
  save_last: False

optimizer:
  lr: 1e-3
  weight_decay: 1e-4

scheduler:
  warmup_epochs: 10
  start_factor: 0.01
  end_factor: 1.0
  eta_min: 1.0e-6

data:
  loader:
    batch_size: 732
    num_workers: 32
    persistent_workers: true