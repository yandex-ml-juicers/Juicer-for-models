# @package _global_
# SegNeXt-S с энкодером MSCAN с ImageNet, без дистилляции — то же самое, что
# cityscapes_scratch_segnext_t.yaml, только вариант s (13.9M против 4.3M у t,
# 81.3 против 79.8 mIoU в статье). Бейзлайн для SegNeXt-ученика и способ
# получить своего учителя (SegNeXt-учитель на готовых cityscapes-весах в
# этом репозитории НЕ настроен — веса есть только на TsingHua Cloud без
# скриптового доступа, см. outputs/claude-analis/analysis.md).
defaults:
  - override /data/dataset: cityscapes_seg
  - override /data/transform/train: cityscapes_seg_strong_transform
  - override /data/transform/eval: cityscapes_seg_transform
  - override /model/teacher: null
  - override /model/student: segnext
  - override /loss: ce
  - override /optimizer: adamw
  - override /scheduler: warmup_cosine
  - override /augment: cutmix_segmentation

name: cityscapes_scratch_segnext_s
device: cuda
deterministic: false

task_type: "segmentation"

clearml:
  enabled: True
  tags: [cityscapes, student, scratch, segnext, segmentation]
  scalars: []
  plots:
    enabled: true
    every_n_epochs: 20
  reuse_last_task_id: False
  continue_last_task: False
  output_uri: false

trainer:
  epochs: 150
  # amp: false — НЕ опечатка, см. cityscapes_scratch_segnext_t.yaml: под AMP
  # градиент SegNeXt обнуляется за 2-3 эпохи (проверено диагностикой),
  # выключен до тех пор, пока не найдено точное нестабильное место.
  amp: false
  grad_clip_norm: 1.0

loss:
  ignore_index: ${data.dataset.ignore_index}
  label_smoothing: 0.0

optimizer:
  lr: 6.0e-5
  weight_decay: 1.0e-2

scheduler:
  warmup_epochs: 10
  eta_min: 1.0e-6

data:
  loader:
    batch_size: 16
    eval_batch_size: 8
    num_workers: 16
    pin_memory: true
    persistent_workers: true

model:
  student:
    variant: s
    pretrained: imagenet
    dropout: 0.1
