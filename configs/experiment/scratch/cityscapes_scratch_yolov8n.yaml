# @package _global_
defaults:
  - override /data/dataset: cityscapes
  - override /data/transform/train: base_cityscapes_transform
  - override /data/transform/eval: base_cityscapes_transform
  - override /model/teacher: null
  - override /model/student: yolov8n
  - override /loss: yolov8n
  - override /optimizer: SGD
  - override /scheduler: warmup_cosine
  - override /prediction_postprocessors: yolov8n

name: cityscapes_scartch_yolov8n
device: cuda
deterministic: false

task_type: "detection"

clearml:
  enabled: True
  tags: [cityscapes, teacher, scratch, yolov8n]
  output_uri: false

trainer:
  epochs: 100
  amp: true
  grad_clip_norm: 1.0

optimizer:
  lr: 0.05
  # momentum: 0.937
  weight_decay: 0.0005

scheduler:
  warmup_epochs: 10
  start_factor: 0.01
  end_factor: 1.0
  eta_min: 1.0e-5

data:
  dataset:
    image_size: [512, 1024]
    targets_format_mode: "yolov8n"
    build:
      label_offset: 0
  loader:
    batch_size: 32
    num_workers: 16
    persistent_workers: true
    pin_memory: true

model:
  student:
    backbone_dropout: 0.0
    neck_dropout: 0.0
    bbox_dropout: 0.0
    cls_dropout: 0.0