# @package _global_
# U-Net с предобученным энкодером из timm, без дистилляции.
defaults:
  - override /data/dataset: cityscapes_seg
  - override /data/transform/train: cityscapes_seg_transform
  - override /data/transform/eval: cityscapes_seg_transform
  - override /model/teacher: null
  - override /model/student: timm_unet
  - override /loss: ce
  - override /optimizer: adamw
  - override /scheduler: warmup_cosine

name: cityscapes_scratch_timm_unet
device: cuda

# max_pool2d.backward и nll_loss2d на CUDA не имеют детерминированных ядер —
# при deterministic=true запуск падает с RuntimeError.
deterministic: false

task_type: "segmentation"

clearml:
  enabled: True
  tags: [cityscapes, student, scratch, timm-unet, pretrained, segmentation]
  scalars: []
  reuse_last_task_id: False
  continue_last_task: False
  output_uri: false

trainer:
  epochs: 150
  amp: true
  grad_clip_norm: 1.0

loss:
  ignore_index: ${data.dataset.ignore_index}
  label_smoothing: 0.0

# Предобученному энкодеру нужен lr НИЖЕ, чем сети с нуля: на 3e-4 первые
# батчи со случайным декодером сносят ImageNet-признаки быстрее, чем те
# успевают пригодиться. Плюс warmup.
#
# Идеально было бы дать энкодеру lr в 10 раз меньше декодера, но тренер
# собирает optimizer одной группой из student.parameters() — раздельных
# param groups сейчас нет. Единый пониженный lr + warmup — рабочая замена.
optimizer:
  lr: 1.0e-4
  weight_decay: 1.0e-2

scheduler:
  warmup_epochs: 5
  eta_min: 1.0e-6

data:
  loader:
    batch_size: 16
    eval_batch_size: 8
    num_workers: 16
    pin_memory: true
    persistent_workers: true

model:
  student:
    variant: resnet18
    pretrained: true
