# @package _global_
# Scratch-бейзлайн для espnetv2_native/s150 (0.72M целиком: энкодер 0.44M +
# декодер ИЗ ОРИГИНАЛЬНОЙ статьи EESPNet_Seg, 0.29M — не наш UNetDoubleConv,
# см. докстринг ESPNetV2Native в src/models/espnetv2.py). Пара для сравнения
# с сеткой дистилляции segmentation/{BPKD,CWD,DIST,FitNets,HeteroAKD,
# vanilla-KD}/cityscapes_*_segformer_b0_to_espnetv2_native_s150.yaml — тот
# же student, тот же рецепт (composite CE+Dice+Lovász, lr/wd/param_groups/
# scheduler/батч), просто без KD-члена и без учителя.
#
# Энкодер — ImageNet-классификатор (официальный чекпоинт sacmehta/ESPNetv2),
# декодер случайный, как и в KD-сетке.
#
# Рецепт скопирован с cityscapes_scratch_timm_unet_mobilenetv3_small_aug_lovasz.yaml
# (scratch-бейзлайн для другого nano-ученика, unet_nano) — та же формула
# lr/warmup/dice+lovasz, меняется только model.student.
defaults:
  - override /data/dataset: cityscapes_seg
  - override /data/transform/train: cityscapes_seg_strong_transform_for_segmentation
  - override /data/transform/eval: cityscapes_seg_transform
  - override /model/teacher: null
  - override /model/student: espnetv2_native
  - override /loss: composite_base
  - override /optimizer: adamw
  - override /scheduler: warmup_cosine
  - override /augment: cutmix_segmentation


name: cityscapes_scratch_espnetv2_native_s150
device: cuda
deterministic: false

task_type: "segmentation"

clearml:
  enabled: True
  tags: [cityscapes, student, scratch, espnetv2-native-s150, nano, segmentation, aug, lovasz]
  scalars: []
  plots:
    enabled: false
    every_n_epochs: 20
  reuse_last_task_id: False
  continue_last_task: False
  output_uri: false

trainer:
  epochs: 100
  amp: true
  grad_clip_norm: 2.5

loss:
  losses:
    dice:
      _target_: src.losses.DiceLoss
      ce_weight: 1.5
      dice_weight: 2.5
    lovasz:
      _target_: src.losses.LovaszSoftmax
      ce_weight: 0.0
      lovasz_weight: 3.5
      pixel_stride: 2
      label_smoothing: 0.05
      ignore_index: ${data.dataset.ignore_index}

  weights:
    dice: 1.0
    lovasz: 0.5

loss_schedule:
  weights.dice: {schedule: cosine, start: 1.0, end: 0.50, start_epoch: 75}
  weights.lovasz: {schedule: cosine, start: 0.5, end: 1.25, start_epoch: 75}

optimizer:
  lr: 2.0e-3
  weight_decay: 3.0e-2

# Раздельный lr энкодер/декодер (docs/param_groups.md): энкодер предобучен,
# декодер/голова — с нуля, общий lr бил бы по предобучению в первые эпохи.
# encoder_lr_mult=0.35 -> энкодеру lr в ~2.86 раза ниже optimizer.lr.
param_groups:
  encoder_lr_mult: 0.35
  no_decay_on_norm_and_bias: false

scheduler:
  warmup_epochs: 20
  eta_min: 1.5e-4

data:
  loader:
    batch_size: 20
    eval_batch_size: 12
    num_workers: 20
    pin_memory: true
    persistent_workers: true

model:
  student:
    variant: s150
    pretrained: imagenet
    dropout: 0.2
