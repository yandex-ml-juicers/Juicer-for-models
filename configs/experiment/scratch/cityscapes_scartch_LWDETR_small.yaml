# @package _global_
defaults:
  - override /data/dataset: cityscapes
  - override /data/transform/train: base_cityscapes_transform
  - override /data/transform/eval: base_cityscapes_transform
  - override /model/teacher: null
  - override /model/student: lwdetr
  - override /loss: lwdetr_small_loss
  - override /optimizer: adam
  - override /scheduler: warmup_cosine

name: cityscapes_scartch_LWDETR_small
device: cuda
deterministic: false

task_type: "detection"

clearml:
  enabled: True
  tags: [cityscapes, teacher, scratch, LW-DETR-small]
  output_uri: false

trainer:
  epochs: 10
  amp: true

optimizer:
  lr: 2.5e-4
  weight_decay: 0.1
  fused: true

scheduler:
  warmup_epochs: 1
  start_factor: 0.01
  end_factor: 1.0
  eta_min: 1.0e-5

# loss:
#   label_smoothing: 0.1

data:
  dataset:
    targets_format_mode: "lw-detr-small"
    build:
      label_offset: 0
  loader:
    batch_size: 16
    num_workers: 16
    persistent_workers: true