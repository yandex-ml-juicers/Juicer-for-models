# @package _global_
defaults:
  - override /data: imagenet100
  - override /model/teacher: null
  - override /model/student: resnet18_imagenet
  - override /loss: ce
  - override /optimizer: adam
  - override /scheduler: cosine

name: imagenet100_resnet18_scratch
device: cuda
deterministic: false

clearml:
  enabled: True
  tags: [imagenet-100, baseline, scratch, resnet18]

trainer:
  epochs: 10
  amp: true

optimizer:
  lr: 1.0e-4
