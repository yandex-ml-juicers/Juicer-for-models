# @package _global_
defaults:
  - override /data/dataset: imagenet100
  - override /model/teacher: null
  - override /model/student: resnet18_imagenet
  - override /loss: ce
  - override /optimizer: SGD
  - override /scheduler: warmup_cosine

name: imagenet100_resnet18_scratch
device: cuda
deterministic: false

clearml:
  enabled: True
  tags: [imagenet-100, baseline, scratch, resnet18]

trainer:
  epochs: 150
  amp: true

optimizer:
  lr: 0.2
  weight_decay: 1e-4

scheduler:
  warmup_epochs: 10
  start_factor: 0.01
  end_factor: 1.0
  eta_min: 1.0e-6

loss:
  label_smoothing: 0.1

data:
  loader:
    batch_size: 256
    num_workers: 16
    persistent_workers: true