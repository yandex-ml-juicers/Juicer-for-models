# @package _global_
defaults:
  - override /data/dataset: imagenet100
  - override /model/teacher: resnet18_imagenet_pretrained
  - override /model/student: resnet18_imagenet
  - override /loss: mgd
  - override /optimizer: SGD

name: imagenet100_mgd_resnet18_to_resnet18

ckpt_path: data/weights/resnet18_scratch/best.pt

optimizer:
  lr: 0.1469789358410702

loss:
  t_channels: 512
  lambda_mgd: 0.0009961730496122815
  mask_ratio: 0.6266000008583069

trainer:
  epochs: 100
  amp: true

