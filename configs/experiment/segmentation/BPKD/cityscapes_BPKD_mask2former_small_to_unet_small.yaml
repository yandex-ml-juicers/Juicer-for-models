# @package _global_
# То же самое, что cityscapes_BPKD_mask2former_tiny_to_unet_small.yaml, но
# учитель — Mask2Former-small (Swin-S, 69M вместо 47M у tiny). Пара к нему:
# сравнение даёт ответ, стоит ли более сильный (и медленный) учитель того на
# этой паре студент/лосс. base (107M) и large (216M) доступны тем же
# конфигом через `model.teacher.variant=base|large` — отдельных файлов под
# них не заведено, чтобы не плодить дубликаты ради одной строчки; учтите,
# что large заметно тяжелее по памяти/времени шага.
#
# batch_size ниже, чем у tiny-пары (16 против 24): учитель на 69M вместо 47M,
# а batch_size оригинального SegFormer-рецепта (80) и без того не влезает в
# одну V100-32GB (см. cityscapes_BPKD_mask2former_tiny_to_unet_small.yaml).
# Отдельно не смоук-тестировался (тестировался tiny) — при OOM убавляйте дальше.
defaults:
  - override /data/dataset: cityscapes_seg
  - override /data/transform/train: cityscapes_seg_strong_transform_for_segmentation
  - override /data/transform/eval: cityscapes_seg_transform
  - override /model/teacher: mask2former
  - override /model/student: timm_unet
  - override /loss: composite_base
  - override /optimizer: adamw
  - override /scheduler: warmup_cosine
  - override /augment: cutmix_segmentation

name: cityscapes_BPKD_mask2former_small_to_unet_small
device: cuda
deterministic: false

task_type: "segmentation"

clearml:
  enabled: True
  tags: [cityscapes, KD, BPKD, mask2former-small, unet-small, segmentation]
  scalars: ['KL_divergence', 'agreement_rate', 'teacher_miou']
  plots:
    enabled: False
    every_n_epochs: 10
  reuse_last_task_id: False
  continue_last_task: False
  output_uri: false

trainer:
  epochs: 100
  amp: true
  grad_clip_norm: 10.0

loss:
  losses:
    bpkd:
      _target_: src.losses.BPKDLoss
      temperature: 2.0
      ce_weight: 0.0
      edge_weight: 1.3
      body_weight: 0.5
      edge_width: 7
      spatial_stride: 2
    dice:
      _target_: src.losses.DiceLoss
      ce_weight: 1.5
      dice_weight: 2.5
    lovasz:
      _target_: src.losses.LovaszSoftmax
      ce_weight: 0.0
      lovasz_weight: 3.5
      pixel_stride: 2
      label_smoothing: 0.05
      ignore_index: ${data.dataset.ignore_index}

  weights:
    bpkd: 1.0
    dice: 1.0
    lovasz: 0.5

loss_schedule:
  weights.bpkd: {schedule: cosine, start: 1.0, end: 0.50, start_epoch: 90}
  weights.dice: {schedule: cosine, start: 1.0, end: 0.50, start_epoch: 90}
  weights.lovasz: {schedule: cosine, start: 0.5, end: 1.00, start_epoch: 80}

optimizer:
  lr: 2.5e-3
  weight_decay: 3.0e-2

# Раздельный lr энкодер/декодер (docs/param_groups.md): энкодер предобучен,
# декодер/голова — с нуля, общий lr бил бы по предобучению в первые эпохи.
# encoder_lr_mult=0.2 -> энкодеру впятеро ниже optimizer.lr.
param_groups:
  encoder_lr_mult: 0.2
  no_decay_on_norm_and_bias: true

scheduler:
  warmup_epochs: 10
  eta_min: 2.0e-6

data:
  loader:
    batch_size: 16
    eval_batch_size: 14
    num_workers: 7
    pin_memory: true
    persistent_workers: true

model:
  student:
    variant: efficientnet_b0
    pretrained: true
    dropout: 0.1
  teacher:
    variant: small
