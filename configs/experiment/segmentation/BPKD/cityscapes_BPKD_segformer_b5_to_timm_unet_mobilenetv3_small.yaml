# @package _global_
# BPKD: SegFormer-B5 -> timm-U-Net(mobilenetv3_small_100), 1.25M параметров —
# первая KD-конфигурация на модели из диапазона 0.5-2M в этом наборе
# экспериментов (см. scratch/cityscapes_scratch_timm_unet_mobilenetv3_small_aug_lovasz.yaml
# для парного scratch-бейзлайна той же архитектуры).
#
# Композиция лосса, оптимизатор и расписание — без изменений скопированы с
# segmentation/BPKD/cityscapes_BPKD_segformer_b5_to_unet_small_CE_dice_lovasz_fast.yaml
# (текущий лучший локальный рецепт на unet_small/efficientnet_b0, 4.24M).
# Единственная содержательная замена — model.student. batch_size у оригинала
# (80) на одной V100-32GB даёт OOM (узкое место — учитель SegFormer-B5, не
# студент, так что более лёгкий студент это не чинит) — здесь стоит 24,
# подтверждённое смоук-тестом. Если сравниваете mIoU с прогоном unet_small
# напрямую, имейте в виду разный батч (24 против 80 у оригинала) — это уже
# не чистая абляция "только студент отличается".
defaults:
  - override /data/dataset: cityscapes_seg
  - override /data/transform/train: cityscapes_seg_strong_transform_for_segmentation
  - override /data/transform/eval: cityscapes_seg_transform
  - override /model/teacher: segformer
  - override /model/student: timm_unet
  - override /loss: composite_base
  - override /optimizer: adamw
  - override /scheduler: warmup_cosine
  - override /augment: cutmix_segmentation

name: cityscapes_BPKD_segformer_b5_to_timm_unet_mobilenetv3_small
device: cuda
deterministic: false

task_type: "segmentation"

clearml:
  enabled: True
  tags: [cityscapes, KD, BPKD, segformer-b5, unet-nano, mobilenetv3-small, segmentation]
  scalars: ['KL_divergence', 'agreement_rate', 'teacher_miou']
  plots:
    enabled: False
    every_n_epochs: 10
  reuse_last_task_id: False
  continue_last_task: False
  output_uri: false

trainer:
  epochs: 100
  amp: true
  grad_clip_norm: 10.0

loss:
  losses:
    bpkd:
      _target_: src.losses.BPKDLoss
      temperature: 2.0
      ce_weight: 0.0
      edge_weight: 1.3
      body_weight: 0.5
      edge_width: 7
      spatial_stride: 2
    dice:
      _target_: src.losses.DiceLoss
      ce_weight: 1.5
      dice_weight: 2.5
    lovasz:
      _target_: src.losses.LovaszSoftmax
      ce_weight: 0.0
      lovasz_weight: 3.5
      pixel_stride: 2
      label_smoothing: 0.05
      ignore_index: ${data.dataset.ignore_index}

  weights:
    bpkd: 1.0
    dice: 1.0
    lovasz: 0.5

loss_schedule:
  weights.bpkd: {schedule: cosine, start: 1.0, end: 0.50, start_epoch: 90}
  weights.dice: {schedule: cosine, start: 1.0, end: 0.50, start_epoch: 90}
  weights.lovasz: {schedule: cosine, start: 0.5, end: 1.00, start_epoch: 80}

optimizer:
  lr: 2.5e-3
  weight_decay: 3.0e-2

scheduler:
  warmup_epochs: 10
  eta_min: 2.0e-6

data:
  loader:
    # batch_size 80 (как в исходном рецепте на unet_small) даёт OOM на одной
    # V100-32GB — узкое место здесь SegFormer-B5, а не студент, так что
    # замена студента на более лёгкий это не чинит (проверено смоук-тестом
    # на паре unet_small; см. комментарий в шапке файла). 24 — подтверждённое
    # рабочее значение.
    batch_size: 24
    eval_batch_size: 14
    num_workers: 7
    pin_memory: true
    persistent_workers: true

model:
  student:
    variant: mobilenetv3_small
    pretrained: true
    dropout: 0.1
  teacher:
    variant: b5
    pretrained: cityscapes
    checkpoint_path: null
