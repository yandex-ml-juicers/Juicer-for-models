# @package _global_
# BPKD: SegFormer-B5 -> SegNeXt-S (первая KD-конфигурация с SegNeXt-учеником
# в этом наборе экспериментов — раньше SegNeXt пробовали только scratch).
# Композиция лосса (bpkd + dice + lovasz) скопирована БЕЗ ИЗМЕНЕНИЙ с
# segmentation/BPKD/cityscapes_BPKD_segformer_b5_to_unet_small_CE_dice_lovasz_fast.yaml
# (текущий лучший локальный рецепт) — BPKD не требует тапов признаков
# (requires_teacher=True, required_features=() в src/losses/bpkd.py), поэтому
# заменить студента можно, ничего не трогая в лоссе.
#
# Оптимизатор — НЕ скопирован с timm_unet-рецепта (lr 2.5e-3 там подобран под
# CNN-декодер U-Net): у SegNeXt/MSCAN своя, заметно более низкая, официальная
# lr (6e-5, см. scratch/cityscapes_scratch_segnext_s.yaml, рецепт статьи) —
# взят её, чтобы не гадать со стабильностью на новой для этого набора
# архитектуре. Батч тоже подстроен под её память (16, как в scratch-рецепте),
# а не унаследован от timm_unet (80) — учитель B5 + SegNeXt-S на одном шаге
# тяжелее, чем учитель B5 + маленький timm-U-Net.
defaults:
  - override /data/dataset: cityscapes_seg
  - override /data/transform/train: cityscapes_seg_strong_transform_for_segmentation
  - override /data/transform/eval: cityscapes_seg_transform
  - override /model/teacher: segformer
  - override /model/student: segnext
  - override /loss: composite_base
  - override /optimizer: adamw
  - override /scheduler: warmup_cosine
  - override /augment: cutmix_segmentation

name: cityscapes_BPKD_segformer_b5_to_segnext_s
device: cuda
deterministic: false

task_type: "segmentation"

clearml:
  enabled: True
  tags: [cityscapes, KD, BPKD, segformer-b5, segnext-s, segmentation]
  scalars: ['KL_divergence', 'agreement_rate', 'teacher_miou']
  plots:
    enabled: False
    every_n_epochs: 10
  reuse_last_task_id: False
  continue_last_task: False
  output_uri: false

trainer:
  epochs: 100
  # amp: false — НЕ опечатка, см. scratch/cityscapes_scratch_segnext_t.yaml:
  # под AMP градиент SegNeXt-студента обнуляется за 2-3 эпохи (проверено
  # диагностикой), выключен до тех пор, пока не найдено точное нестабильное
  # место в src/models/segnext.py.
  amp: false
  grad_clip_norm: 10.0

loss:
  losses:
    bpkd:
      _target_: src.losses.BPKDLoss
      temperature: 2.0
      ce_weight: 0.0
      edge_weight: 1.3
      body_weight: 0.5
      edge_width: 7
      spatial_stride: 2
    dice:
      _target_: src.losses.DiceLoss
      ce_weight: 1.5
      dice_weight: 2.5
    lovasz:
      _target_: src.losses.LovaszSoftmax
      ce_weight: 0.0
      lovasz_weight: 3.5
      pixel_stride: 2
      label_smoothing: 0.05
      ignore_index: ${data.dataset.ignore_index}

  weights:
    bpkd: 1.0
    dice: 1.0
    lovasz: 0.5

loss_schedule:
  weights.bpkd: {schedule: cosine, start: 1.0, end: 0.50, start_epoch: 90}
  weights.dice: {schedule: cosine, start: 1.0, end: 0.50, start_epoch: 90}
  weights.lovasz: {schedule: cosine, start: 0.5, end: 1.00, start_epoch: 80}

optimizer:
  lr: 6.0e-5
  weight_decay: 1.0e-2

# Раздельный lr энкодер/декодер (docs/param_groups.md): энкодер предобучен,
# декодер/голова — с нуля, общий lr бил бы по предобучению в первые эпохи.
# encoder_lr_mult=0.2 -> энкодеру впятеро ниже optimizer.lr.
param_groups:
  encoder_lr_mult: 0.2
  no_decay_on_norm_and_bias: true

scheduler:
  warmup_epochs: 10
  eta_min: 1.0e-6

data:
  loader:
    # batch_size снижен вдвое (16 -> 8) относительно версии с AMP: amp:false
    # выше означает, что и учитель SegFormer-B5 теперь считается в fp32
    # (AMP — один флаг на трейнер, отдельного per-model контроля пока нет),
    # а это заметно больше памяти, чем в fp16-версии, которая и была
    # смоук-тестирована при batch=16. Не перепроверял этот батч отдельно —
    # если не влезет, убавляйте дальше или добавляйте
    # +model.teacher_micro_batch_size=N (src/models/chunked_teacher.py).
    batch_size: 8
    eval_batch_size: 8
    num_workers: 16
    pin_memory: true
    persistent_workers: true

model:
  student:
    variant: s
    pretrained: imagenet
    dropout: 0.1
  teacher:
    variant: b5
    pretrained: cityscapes
    checkpoint_path: null
