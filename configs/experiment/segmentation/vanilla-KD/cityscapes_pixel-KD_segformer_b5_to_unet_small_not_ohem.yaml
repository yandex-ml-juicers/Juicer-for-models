# @package _global_
# DIST (arXiv:2205.10536): SegFormer-B2 -> U-Net-base.
# Вместо точного совпадения вероятностей требуется совпадение ПОРЯДКА —
# метод рассчитан ровно на случай большого разрыва между учителем и учеником,
# а разрыв "предобученный трансформер против U-Net с нуля" здесь максимальный
# из всей сетки.
# Бейзлайн для этого прогона — scratch/cityscapes_scratch_unet_base.
defaults:
  - override /data/dataset: cityscapes_seg
  - override /data/transform/train: cityscapes_seg_strong_transform_for_segmentation
  - override /data/transform/eval: cityscapes_seg_transform
  - override /model/teacher: segformer
  - override /model/student: timm_unet
  - override /loss: composite_base
  - override /optimizer: adamw
  - override /scheduler: warmup_cosine
  - override /augment: cutmix_segmentation

name: cityscapes_pixel-KD_segformer_b5_to_unet_small
device: cuda
deterministic: false

task_type: "segmentation"

clearml:
  enabled: True
  tags: [cityscapes, KD, pixel_kd, segformer-b5, unet-smal, segmentation]
  # Схожесть ученика с учителем по пикселям: KL и доля совпавших argmax'ов.
  # Считаются по подвыборке пикселей на probe-батчах, цена — доли процента эпохи.
  scalars: ['KL_divergence', 'agreement_rate']
  plots:
    enabled: False
    every_n_epochs: 10
  reuse_last_task_id: false
  continue_last_task: False
  output_uri: false

trainer:
  epochs: 100
  amp: true
  grad_clip_norm: 2.5

loss:
  losses:
    pixel:
      _target_: src.losses.PixelWiseKD
      temperature: 2.5
      alpha: 0.5
    dice:
      _target_: src.losses.DiceLoss
      ce_weight: 1.0
      dice_weight: 2.0
    #ohem:
    #  _target_: src.losses.OhemCrossEntropy
    #  thresh: 0.7
    #  keep_ratio: 0.1
    #  ignore_index: ${data.dataset.ignore_index}
    lovasz:
      _target_: src.losses.LovaszSoftmax
      ce_weight: 0.0
      lovasz_weight: 3.5
      pixel_stride: 2
      label_smoothing: 0.05
      ignore_index: ${data.dataset.ignore_index}

    
  weights:
    pixel: 0.75
    dice: 0.1
    #ohem: 0.45
    lovasz: 0.1

loss_schedule:
  weights.pixel: {schedule: cosine, start: 1.0, end: 0.25, start_epoch: 75}
  weights.dice: {schedule: cosine, start: 0.1, end: 0.3, start_epoch: 60}
  weights.ohem: {schedule: cosine, start: 0.45, end: 0.1, start_epoch: 75}
  weights.lovasz: {schedule: cosine, start: 0.1, end: 0.75, start_epoch: 75}

optimizer:
  lr: 1.0e-3
  weight_decay: 3.0e-2

scheduler:
  warmup_epochs: 20
  eta_min: 3.0e-4

data:
  loader:
    batch_size: 16
    eval_batch_size: 10
    num_workers: 16
    pin_memory: true
    persistent_workers: true

model:
  student:
    variant: efficientnet_b0
    pretrained: true
    dropout: 0.1
  teacher:
    variant: b5
    pretrained: cityscapes
    checkpoint_path: null
#  teacher_inference:
#    scales: [1.0, 1.25]
#    flip: true
