# @package _global_
# Ванильная KD Хинтона (arXiv:1503.02531) попиксельно: SegFormer-B2 -> U-Net-base.
# Базовый метод сетки: сравнивает только распределения по классам в каждом
# пикселе, никакой структуры сцены не использует.
#
# Бейзлайн для этого прогона — scratch/cityscapes_scratch_unet_base.
defaults:
  - override /data/dataset: cityscapes_seg
  - override /data/transform/train: cityscapes_seg_transform
  - override /data/transform/eval: cityscapes_seg_transform
  - override /model/teacher: segformer
  - override /model/student: unet
  - override /loss: pixel_kd
  - override /optimizer: adamw
  - override /scheduler: warmup_cosine

name: cityscapes_pixel-KD_segformer_b2_to_unet_base
device: cuda
deterministic: false

task_type: "segmentation"

clearml:
  enabled: True
  tags: [cityscapes, KD, pixel-KD, segformer-b2, unet-base, segmentation]
  # Схожесть ученика с учителем по пикселям: KL и доля совпавших argmax'ов.
  # Считаются по подвыборке пикселей на probe-батчах, цена — доли процента эпохи.
  scalars: ['KL_divergence', 'agreement_rate']
  reuse_last_task_id: False
  continue_last_task: False
  output_uri: false

trainer:
  epochs: 200
  amp: true
  grad_clip_norm: 1.0

loss:
  temperature: 4.0
  alpha: 0.5

# U-Net обучается с нуля (ImageNet-инициализации у него нет), поэтому lr выше,
# чем в конфигах с предобученным энкодером.
optimizer:
  lr: 3.0e-4
  weight_decay: 1.5e-2

scheduler:
  warmup_epochs: 15
  eta_min: 1.0e-6

data:
  loader:
    batch_size: 20
    eval_batch_size: 10
    num_workers: 20
    pin_memory: true
    persistent_workers: true

model:
  student:
    variant: base
  teacher:
    variant: b2
    pretrained: cityscapes
    checkpoint_path: null
