# @package _global_
# HeteroAKD (arXiv:2504.07691): SegFormer-B5 -> timm-U-Net(efficientnet_b0).
# Метод создан ровно для этой ситуации — учитель и ученик РАЗНЫХ архитектур.
# Признаки трансформера и свёрточной сети живут в несопоставимых
# пространствах, поэтому обе модели сначала проецируются 1x1-свёрткой в
# пространство классов, потом таргет собирается смесью учителя и ученика по
# их надёжности (KMM), а пиксели взвешиваются по отставанию ученика (KEM).
#
# Прямой конкурент — cityscapes_FitNets_dice_ohem_segformer_b5_to_unet_small:
# оба дистиллируют промежуточные признаки, но FitNets требует буквального
# совпадения карт, а здесь сравниваются только предсказания о классах.
# Всё остальное (оптимизатор, расписание, батч, эпохи) совпадает.
#
# У лосса есть ОБУЧАЕМЫЕ параметры (два проектора). Они уходят в optimizer
# вместе с учеником и лежат в чекпоинте под criterion_state — если будете
# дообучать с этого прогона, их надо загружать тоже.
defaults:
  - override /data/dataset: cityscapes_seg
  - override /data/transform/train: cityscapes_seg_strong_transform_for_segmentation
  - override /data/transform/eval: cityscapes_seg_transform
  - override /model/teacher: segformer
  - override /model/student: timm_unet
  - override /loss: composite_base
  - override /optimizer: adamw
  - override /scheduler: warmup_cosine
  - override /augment: cutmix_segmentation

name: cityscapes_HeteroAKD_segformer_b5_to_unet_small
device: cuda
deterministic: false

task_type: "segmentation"

clearml:
  enabled: True
  tags: [cityscapes, KD, HeteroAKD, segformer-b5, unet-small, segmentation]
  scalars: ['KL_divergence', 'agreement_rate']
  plots:
    enabled: False
    every_n_epochs: 10
  reuse_last_task_id: false
  continue_last_task: False
  output_uri: false

trainer:
  epochs: 100
  amp: true
  grad_clip_norm: 2.5

loss:
  losses:
    hetero:
      _target_: src.losses.HeteroAKDLoss
      # taps.stage4 — страйд 32: 320 каналов у efficientnet_b0, 512 у MiT-B5.
      layer: taps.stage4
      student_channels: 320
      teacher_channels: 512
      temperature: 1.0
      ce_weight: 0.0
      kd_weight: 1.3
      # hakd — взвешенное СРЕДНЕЕ по пикселям (веса KEM суммируются в
      # единицу), поэтому его значение на порядок меньше остальных членов:
      # при весе 1.0 замер дал 0.03 против 1.27 у proj, то есть сам метод
      # давал 2% своего же слагаемого. 15 выводит его в 35-40%.
      hakd_weight: 30.0
      # proj — единственное, что обучает проектор УЧИТЕЛЯ (таргет отсоединён
      # от графа), поэтому в ноль его ронять нельзя: без обученного проектора
      # KMM всегда будет считать учителя ненадёжным, hakd так и останется
      # около нуля. Половина веса — компромисс.
      proj_weight: 1.5
    dice:
      _target_: src.losses.DiceLoss
      ce_weight: 0.0
      dice_weight: 3.5
    ohem:
      _target_: src.losses.OhemCrossEntropy
      thresh: 0.7
      keep_ratio: 0.1
      ignore_index: ${data.dataset.ignore_index}
    lovasz:
      _target_: src.losses.LovaszSoftmax
      ce_weight: 0.0
      lovasz_weight: 3.5
      pixel_stride: 2
      label_smoothing: 0.05
      ignore_index: ${data.dataset.ignore_index}

  weights:
    hetero: 0.5
    dice: 0.1
    ohem: 0.3
    lovasz: 0.1

loss_schedule:
  weights.hetero: {schedule: cosine, start: 1.0, end: 0.0, start_epoch: 120}
  weights.dice: {schedule: cosine, start: 1.0, end: 0.7, start_epoch: 120}
  weights.ohem: {schedule: cosine, start: 1.0, end: 0.5, start_epoch: 120}
  weights.lovasz: {schedule: cosine, start: 1.0, end: 0.5, start_epoch: 120}

optimizer:
  lr: 1.0e-3
  weight_decay: 3.0e-2

scheduler:
  warmup_epochs: 0
  eta_min: 3.0e-4

data:
  loader:
    batch_size: 16
    eval_batch_size: 10
    num_workers: 16
    pin_memory: true
    persistent_workers: true

model:
  student:
    variant: efficientnet_b0
    pretrained: true
    dropout: 0.1
  teacher:
    variant: b5
    pretrained: cityscapes
    checkpoint_path: null
#  teacher_inference:
#    scales: [1.0, 1.25]
#    flip: true
