# @package _global_
# АБЛЯЦИЯ 1/4 (см. outputs/claude-analis/analysis.md): чистая дистилляция,
# БЕЗ конкурирующих GT-членов. Тот же учитель/студент/оптимизатор/батч, что
# в segmentation/BPKD/cityscapes_BPKD_segformer_b5_to_unet_small_CE_dice_lovasz_fast.yaml
# (текущий лучший локальный рецепт) — ЕДИНСТВЕННОЕ отличие: loss. Там
# BPKD+Dice+Lovász считаются ОДНОВРЕМЕННО с фиксированными весами почти всё
# обучение; если они хоть немного конфликтуют по градиенту (учитель неправ
# на пикселе, а Lovász тянет к правильному), выигрыш от одного гасится
# проигрышем от другого. Здесь — ТОЛЬКО BPKD (edge+body по учителю),
# ce_weight=0.0: разметка не участвует вообще, только то, что "думает" учитель.
#
# Вопрос, на который отвечает прогон: если ученик, обучаемый ИСКЛЮЧИТЕЛЬНО
# смотреть на учителя (без единой опоры на GT), всё равно не обгоняет
# scratch+Lovász (см. scratch/cityscapes_scratch_timm_unet_small_aug_lovasz.yaml,
# ~0.77-0.78 mIoU) — сам KD-сигнал бесполезен для этой пары архитектур,
# независимо от конфликта градиентов с GT-членами.
#
# edge_weight/body_weight — те же 1.3/0.5, что были ЭФФЕКТИВНО (после
# домножения на внешний вес композиции bpkd:1.0) в CE_dice_lovasz_fast —
# смысл в том, чтобы поменять ровно одну переменную (наличие GT-членов),
# а не заодно перетюнить и веса BPKD.
defaults:
  - override /data/dataset: cityscapes_seg
  - override /data/transform/train: cityscapes_seg_strong_transform_for_segmentation
  - override /data/transform/eval: cityscapes_seg_transform
  - override /model/teacher: segformer
  - override /model/student: timm_unet
  - override /loss: bpkd
  - override /optimizer: adamw
  - override /scheduler: warmup_cosine
  - override /augment: cutmix_segmentation

name: cityscapes_BPKD_pure_segformer_b5_to_unet_small
device: cuda
deterministic: false

task_type: "segmentation"

clearml:
  enabled: True
  tags: [cityscapes, KD, BPKD, pure, ablation, segformer-b5, unet-small, segmentation]
  scalars: ['KL_divergence', 'agreement_rate', 'teacher_miou']
  plots:
    enabled: False
    every_n_epochs: 10
  reuse_last_task_id: False
  continue_last_task: False
  output_uri: false

trainer:
  epochs: 100
  amp: true
  grad_clip_norm: 5.0

# Никакого loss_schedule: одно слагаемое, гасить/наращивать нечего — это и
# есть смысл абляции (веса BPKD постоянны весь прогон).
loss:
  temperature: 2.0
  ce_weight: 0.0
  edge_weight: 1.3
  body_weight: 0.5
  edge_width: 7
  spatial_stride: 2

optimizer:
  lr: 2.0e-3
  weight_decay: 3.0e-2

# Раздельный lr энкодер/декодер (docs/param_groups.md): энкодер предобучен,
# декодер/голова — с нуля, общий lr бил бы по предобучению в первые эпохи.
# encoder_lr_mult=0.35 -> энкодеру lr в ~2.86 раза ниже optimizer.lr
# (энкодер — большая доля весов модели, 0.2 было слишком консервативно).
param_groups:
  encoder_lr_mult: 0.35
  no_decay_on_norm_and_bias: false

scheduler:
  warmup_epochs: 10
  eta_min: 2.0e-6

data:
  loader:
    batch_size: 20
    eval_batch_size: 12
    num_workers: 20
    pin_memory: true
    persistent_workers: true

model:
  student:
    variant: efficientnet_b0
    pretrained: true
    dropout: 0.1
  teacher:
    variant: b5
    pretrained: cityscapes
    checkpoint_path: null
