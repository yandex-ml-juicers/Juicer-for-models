# @package _global_
# АБЛЯЦИЯ 4/4 (см. outputs/claude-analis/analysis.md): больший студент,
# тот же учитель B5. timm-U-Net/efficientnetv2_b2 (9.04M — пара к classic
# unet variant=base, 7.76M, см. таблицу в src/models/timm_unet.py) вместо
# efficientnet_b0 (4.24M) — вдвое больше "места" под таргеты учителя, при
# том же самом разрыве по силе (тот же B5, mIoU~0.8141).
#
# Вопрос, на который отвечает прогон: если у более крупного студента KD
# наконец даёт +mIoU над его собственным scratch-бейзлайном (которого пока
# нет в этом наборе экспериментов — понадобится
# scratch/cityscapes_scratch_timm_unet_base_aug_lovasz.yaml или аналог для
# честного сравнения), это подтверждает, что unet_small/tiny просто
# упираются в потолок ёмкости независимо от качества таргетов учителя, а не
# что KD как таковая бесполезна.
#
# Рецепт лосса/оптимизатора — тот же композит, что в остальных трёх
# абляциях. batch_size снижен вдвое (24 -> 12, без отдельного смоук-теста):
# студент почти вдвое тяжелее по параметрам, а память и без того на грани
# при 24 (см. analysis.md про OOM на этой же паре учитель/студент) — если
# всё же не влезет, убавляйте дальше или добавляйте
# +model.teacher_micro_batch_size=N (src/models/chunked_teacher.py).
defaults:
  - override /data/dataset: cityscapes_seg
  - override /data/transform/train: cityscapes_seg_strong_transform_for_segmentation
  - override /data/transform/eval: cityscapes_seg_transform
  - override /model/teacher: segformer
  - override /model/student: timm_unet
  - override /loss: composite_base
  - override /optimizer: adamw
  - override /scheduler: warmup_cosine
  - override /augment: cutmix_segmentation

name: cityscapes_BPKD_segformer_b5_to_unet_base
device: cuda
deterministic: false

task_type: "segmentation"

clearml:
  enabled: True
  tags: [cityscapes, KD, BPKD, ablation, segformer-b5, unet-base, segmentation]
  scalars: ['KL_divergence', 'agreement_rate', 'teacher_miou']
  plots:
    enabled: False
    every_n_epochs: 10
  reuse_last_task_id: False
  continue_last_task: False
  output_uri: false

trainer:
  epochs: 100
  amp: true
  grad_clip_norm: 10.0

loss:
  losses:
    bpkd:
      _target_: src.losses.BPKDLoss
      temperature: 2.0
      ce_weight: 0.0
      edge_weight: 1.3
      body_weight: 0.5
      edge_width: 7
      spatial_stride: 2
    dice:
      _target_: src.losses.DiceLoss
      ce_weight: 1.5
      dice_weight: 2.5
    lovasz:
      _target_: src.losses.LovaszSoftmax
      ce_weight: 0.0
      lovasz_weight: 3.5
      pixel_stride: 2
      label_smoothing: 0.05
      ignore_index: ${data.dataset.ignore_index}

  weights:
    bpkd: 1.0
    dice: 1.0
    lovasz: 0.5

loss_schedule:
  weights.bpkd: {schedule: cosine, start: 1.0, end: 0.50, start_epoch: 90}
  weights.dice: {schedule: cosine, start: 1.0, end: 0.50, start_epoch: 90}
  weights.lovasz: {schedule: cosine, start: 0.5, end: 1.00, start_epoch: 80}

optimizer:
  lr: 1.0e-3
  weight_decay: 3.0e-2

# Раздельный lr энкодер/декодер (docs/param_groups.md): энкодер предобучен,
# декодер/голова — с нуля, общий lr бил бы по предобучению в первые эпохи.
# encoder_lr_mult=0.2 -> энкодеру впятеро ниже optimizer.lr.
param_groups:
  encoder_lr_mult: 0.2
  no_decay_on_norm_and_bias: true

scheduler:
  warmup_epochs: 10
  eta_min: 2.0e-6

data:
  loader:
    batch_size: 20
    eval_batch_size: 12
    num_workers: 20
    pin_memory: true
    persistent_workers: true

model:
  student:
    variant: efficientnetv2_b2
    pretrained: true
    dropout: 0.1
  teacher:
    variant: b5
    pretrained: cityscapes
    checkpoint_path: null
