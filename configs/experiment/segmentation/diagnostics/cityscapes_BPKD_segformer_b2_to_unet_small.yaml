# @package _global_
# АБЛЯЦИЯ 2/4 (см. outputs/claude-analis/analysis.md): уменьшить разрыв
# ёмкостей учитель/студент. Рецепт лосса/оптимизатора/батча — БЕЗ ИЗМЕНЕНИЙ
# скопирован с
# segmentation/BPKD/cityscapes_BPKD_segformer_b5_to_unet_small_CE_dice_lovasz_fast.yaml
# (текущий лучший локальный рецепт) — ЕДИНСТВЕННОЕ отличие: учитель SegFormer-B2
# (mIoU~0.7994 на eval, см. outputs/eval_teacher_b2) вместо B5 (~0.8141).
# Учитель слабее всего на ~1.5 mIoU, а разница в параметрах — на порядок
# (B2 ~27.5M против B5 ~85M) — то есть студенту (4.24M) THEIR "уровень"
# гораздо ближе.
#
# Вопрос, на который отвечает прогон: если МЕНЕЕ сильный, но БЛИЖЕ по
# ёмкости учитель неожиданно даёт студенту прирост над scratch+Lovász, а
# B5 (сильнее, но дальше по ёмкости) — нет, это прямое подтверждение
# capacity gap (Cho & Hariharan 2019; Mirzadeh et al. 2020, Teacher Assistant).
# Сравнивать с segmentation/diagnostics/cityscapes_BPKD_pure_segformer_b5_to_unet_small.yaml
# и с обычным B5-прогоном (тот же рецепт, тот же студент).
defaults:
  - override /data/dataset: cityscapes_seg
  - override /data/transform/train: cityscapes_seg_strong_transform_for_segmentation
  - override /data/transform/eval: cityscapes_seg_transform
  - override /model/teacher: segformer
  - override /model/student: timm_unet
  - override /loss: composite_base
  - override /optimizer: adamw
  - override /scheduler: warmup_cosine
  - override /augment: cutmix_segmentation

name: cityscapes_BPKD_segformer_b2_to_unet_small
device: cuda
deterministic: false

task_type: "segmentation"

clearml:
  enabled: True
  tags: [cityscapes, KD, BPKD, ablation, segformer-b2, unet-small, segmentation]
  scalars: ['KL_divergence', 'agreement_rate', 'teacher_miou']
  plots:
    enabled: False
    every_n_epochs: 10
  reuse_last_task_id: False
  continue_last_task: False
  output_uri: false

trainer:
  epochs: 100
  amp: true
  grad_clip_norm: 10.0

loss:
  losses:
    bpkd:
      _target_: src.losses.BPKDLoss
      temperature: 2.0
      ce_weight: 0.0
      edge_weight: 1.3
      body_weight: 0.5
      edge_width: 7
      spatial_stride: 2
    dice:
      _target_: src.losses.DiceLoss
      ce_weight: 1.5
      dice_weight: 2.5
    lovasz:
      _target_: src.losses.LovaszSoftmax
      ce_weight: 0.0
      lovasz_weight: 3.5
      pixel_stride: 2
      label_smoothing: 0.05
      ignore_index: ${data.dataset.ignore_index}

  weights:
    bpkd: 1.0
    dice: 1.0
    lovasz: 0.5

loss_schedule:
  weights.bpkd: {schedule: cosine, start: 1.0, end: 0.50, start_epoch: 90}
  weights.dice: {schedule: cosine, start: 1.0, end: 0.50, start_epoch: 90}
  weights.lovasz: {schedule: cosine, start: 0.5, end: 1.00, start_epoch: 80}

optimizer:
  lr: 2.5e-3
  weight_decay: 3.0e-2

scheduler:
  warmup_epochs: 10
  eta_min: 2.0e-6

data:
  loader:
    batch_size: 24
    eval_batch_size: 14
    num_workers: 7
    pin_memory: true
    persistent_workers: true

model:
  student:
    variant: efficientnet_b0
    pretrained: true
    dropout: 0.1
  teacher:
    variant: b2
    pretrained: cityscapes
    checkpoint_path: null
