# @package _global_
# Полное обучение: Mask2Former-tiny (Swin-T, 47M) -> SegNeXt-T (4.3M) с
# FitNets. Гиперпараметры — от отлаженного
# segmentation/FitNets/cityscapes_FitNets_segformer_b2_to_segnext_t.yaml (тот
# же студент, SegNeXt-специфичные lr/batch/schedule), меняется учитель и
# teacher_channels тапов.
#
# FitNets (arXiv:1412.6550): hint по stage3+stage4. Student (SegNeXt-T,
# без изменений от b2-версии): stage3=160, stage4=256. Teacher — Swin-T
# энкодер Mask2Former-tiny (encoder_hidden_states, см. докстринг
# src/models/mask2former.py): канонические каналы Swin-Tiny по стадиям —
# 96/192/384/768, то есть stage3=384, stage4=768 (та же цифра, что уже
# используется в HeteroAKD-паре с этим учителем — согласовано).
defaults:
  - override /data/dataset: cityscapes_seg
  - override /data/transform/train: cityscapes_seg_strong_transform_for_segmentation
  - override /data/transform/eval: cityscapes_seg_transform
  - override /model/teacher: mask2former
  - override /model/student: segnext
  - override /loss: composite_base
  - override /optimizer: adamw
  - override /scheduler: warmup_cosine
  - override /augment: cutmix_segmentation

name: cityscapes_FitNets_mask2former_tiny_to_segnext_t
device: cuda
deterministic: false

task_type: "segmentation"

clearml:
  enabled: True
  tags: [cityscapes, KD, FitNets, mask2former-tiny, segnext-t, segmentation]
  scalars: ['KL_divergence', 'agreement_rate', 'teacher_miou']
  plots:
    enabled: False
    every_n_epochs: 10
  reuse_last_task_id: False
  continue_last_task: False
  output_uri: false

trainer:
  epochs: 100
  # amp: false — НЕ опечатка, см. scratch/cityscapes_scratch_segnext_t.yaml:
  # под AMP градиент SegNeXt-студента обнуляется за 2-3 эпохи.
  amp: false
  grad_clip_norm: 10.0

loss:
  losses:
    fitnets:
      _target_: src.losses.FitNetsKD
      _convert_: all
      ce_weight: 0.0
      hint_weight: 1.0
      logits_weight: 0.6
      temperature: 2.0
      normalize_features: false
      layers:
        taps.stage3: { student_channels: 160, teacher_channels: 384, weight: 1.4 }
        taps.stage4: { student_channels: 256, teacher_channels: 768, weight: 0.8 }
      ignore_index: ${data.dataset.ignore_index}
    dice:
      _target_: src.losses.DiceLoss
      ce_weight: 1.5
      dice_weight: 2.5
    lovasz:
      _target_: src.losses.LovaszSoftmax
      ce_weight: 0.0
      lovasz_weight: 3.5
      pixel_stride: 2
      label_smoothing: 0.05
      ignore_index: ${data.dataset.ignore_index}

  weights:
    fitnets: 2.0
    dice: 1.0
    lovasz: 0.5

loss_schedule:
  weights.fitnets: {schedule: cosine, start: 2.0, end: 1.00, start_epoch: 75}
  weights.dice: {schedule: cosine, start: 1.0, end: 0.50, start_epoch: 75}
  weights.lovasz: {schedule: cosine, start: 0.5, end: 1.25, start_epoch: 75}

optimizer:
  lr: 2.0e-3
  weight_decay: 3.0e-2

# Раздельный lr энкодер/декодер (docs/param_groups.md): энкодер предобучен,
# декодер/голова — с нуля, общий lr бил бы по предобучению в первые эпохи.
# encoder_lr_mult=0.35 -> энкодеру lr в ~2.86 раза ниже optimizer.lr
# (энкодер — большая доля весов модели, 0.2 было слишком консервативно).
param_groups:
  encoder_lr_mult: 0.35
  no_decay_on_norm_and_bias: false

scheduler:
  warmup_epochs: 10
  eta_min: 1.5e-4

data:
  loader:
    batch_size: 16
    eval_batch_size: 10
    num_workers: 16
    pin_memory: true
    persistent_workers: true

model:
  student:
    variant: t
    pretrained: imagenet
    dropout: 0.1
  teacher:
    variant: tiny
