# @package _global_
# Сетка "6 методов дистилляции x 4 пары учитель/студент" (см.
# outputs/claude-analis/analysis.md, ответ на вопросы про capacity gap и
# набор лоссов). Учитель SegFormer-B2 (eval mIoU~0.7994) ->
# segnext_t (segnext/t, ~4.3M).
#
# Структура (dice+lovasz рядом с KD-членом, форма loss_schedule,
# оптимизатор/батч/трейнер) — БЕЗ ИЗМЕНЕНИЙ из
# segmentation/diagnostics/cityscapes_BPKD_segformer_b2_to_unet_small.yaml
# (так просили) — меняется учитель/студент и KD-слагаемое.
#
# FitNets (arXiv:1412.6550): hint по stage3+stage4, каналы замерены runtime (student 160/256, teacher 320/512).
defaults:
  - override /data/dataset: cityscapes_seg
  - override /data/transform/train: cityscapes_seg_strong_transform_for_segmentation
  - override /data/transform/eval: cityscapes_seg_transform
  - override /model/teacher: segformer
  - override /model/student: segnext
  - override /loss: composite_base
  - override /optimizer: adamw
  - override /scheduler: warmup_cosine
  - override /augment: cutmix_segmentation

name: cityscapes_FitNets_segformer_b2_to_segnext_t
device: cuda
deterministic: false

task_type: "segmentation"

clearml:
  enabled: True
  tags: [cityscapes, KD, FitNets, segformer-b2, segnext-t, segmentation]
  scalars: ['KL_divergence', 'agreement_rate', 'teacher_miou']
  plots:
    enabled: False
    every_n_epochs: 10
  reuse_last_task_id: False
  continue_last_task: False
  output_uri: false

trainer:
  epochs: 100
  # amp: false — НЕ опечатка, см. scratch/cityscapes_scratch_segnext_t.yaml:
  # под AMP градиент SegNeXt-студента обнуляется за 2-3 эпохи.
  amp: false
  grad_clip_norm: 10.0

loss:
  losses:
    fitnets:
      _target_: src.losses.FitNetsKD
      _convert_: all
      ce_weight: 0.0
      hint_weight: 1.0
      logits_weight: 0.6
      temperature: 2.0
      normalize_features: false
      layers:
        taps.stage3: { student_channels: 160, teacher_channels: 320, weight: 1.0 }
        taps.stage4: { student_channels: 256, teacher_channels: 512, weight: 0.6 }
      ignore_index: ${data.dataset.ignore_index}
    dice:
      _target_: src.losses.DiceLoss
      ce_weight: 1.5
      dice_weight: 2.5
    lovasz:
      _target_: src.losses.LovaszSoftmax
      ce_weight: 0.0
      lovasz_weight: 3.5
      pixel_stride: 2
      label_smoothing: 0.05
      ignore_index: ${data.dataset.ignore_index}

  weights:
    fitnets: 1.0
    dice: 1.0
    lovasz: 0.5

loss_schedule:
  weights.fitnets: {schedule: cosine, start: 1.0, end: 0.50, start_epoch: 75}
  weights.dice: {schedule: cosine, start: 1.0, end: 0.50, start_epoch: 75}
  weights.lovasz: {schedule: cosine, start: 0.5, end: 1.25, start_epoch: 75}

optimizer:
  # lr/wd — НЕ из шаблона (тот 1.5e-3 подобран под U-Net-декодер): SegNeXt
  # использует свою, заметно более низкую lr (см. scratch/cityscapes_scratch_segnext_t.yaml).
  lr: 6.0e-5
  weight_decay: 1.0e-2

scheduler:
  warmup_epochs: 10
  eta_min: 1.0e-6

data:
  loader:
    # batch_size снижен относительно шаблона (20 -> 12): amp:false выше
    # означает, что и учитель считается в fp32, а не fp16 — заметно больше
    # памяти. Не проверял точное значение под каждую пару — если не влезет,
    # убавляйте дальше или добавляйте +model.teacher_micro_batch_size=N.
    batch_size: 12
    eval_batch_size: 10
    num_workers: 16
    pin_memory: true
    persistent_workers: true

model:
  student:
    variant: t
    pretrained: imagenet
    dropout: 0.1
  teacher:
    variant: b2
    pretrained: cityscapes
    checkpoint_path: null
