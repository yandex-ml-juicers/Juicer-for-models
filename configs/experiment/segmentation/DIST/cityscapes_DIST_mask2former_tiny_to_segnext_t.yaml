# @package _global_
# Полное обучение: Mask2Former-tiny (Swin-T, 47M) -> SegNeXt-T (4.3M) с DIST
# (arXiv:2205.10536) — пара к
# segmentation/BPKD/cityscapes_BPKD_mask2former_tiny_to_segnext_t.yaml, тот
# же учитель/студент, другой метод дистилляции. DIST вместо точного
# совпадения вероятностей (KL, как у BPKD) требует совпадения ПОРЯДКА —
# корреляция Пирсона по классам внутри пикселя (inter) и по пикселям внутри
# класса (intra). Тоже не требует тапов признаков.
#
# Лосс — целиком group `loss/composite_dist_dice` без переопределений
# (dist 0.7 + dice 0.3, дефолтные temperature/beta/gamma), как в
# segmentation/DIST/cityscapes_DIST_segformer_b2_to_segnext_t.yaml. Остальные
# гиперпараметры (lr/batch/schedule) — оттуда же, SegNeXt-специфичные.
defaults:
  - override /data/dataset: cityscapes_seg
  - override /data/transform/train: cityscapes_seg_strong_transform_for_segmentation
  - override /data/transform/eval: cityscapes_seg_transform
  - override /model/teacher: mask2former
  - override /model/student: segnext
  - override /loss: composite_dist_dice
  - override /optimizer: adamw
  - override /scheduler: warmup_cosine
  - override /augment: cutmix_segmentation

name: cityscapes_DIST_mask2former_tiny_to_segnext_t
device: cuda
deterministic: false

task_type: "segmentation"

clearml:
  enabled: True
  tags: [cityscapes, KD, DIST, mask2former-tiny, segnext-t, segmentation]
  scalars: ['KL_divergence', 'agreement_rate', 'teacher_miou']
  plots:
    enabled: False
    every_n_epochs: 10
  reuse_last_task_id: False
  continue_last_task: False
  output_uri: false

trainer:
  epochs: 100
  # amp: false — НЕ опечатка, см. scratch/cityscapes_scratch_segnext_t.yaml:
  # под AMP градиент SegNeXt-студента обнуляется за 2-3 эпохи.
  amp: false
  grad_clip_norm: 10.0

optimizer:
  lr: 2.0e-3
  weight_decay: 3.0e-2

# Раздельный lr энкодер/декодер (docs/param_groups.md): энкодер предобучен,
# декодер/голова — с нуля, общий lr бил бы по предобучению в первые эпохи.
# encoder_lr_mult=0.35 -> энкодеру lr в ~2.86 раза ниже optimizer.lr
# (энкодер — большая доля весов модели, 0.2 было слишком консервативно).
param_groups:
  encoder_lr_mult: 0.35
  no_decay_on_norm_and_bias: false

scheduler:
  warmup_epochs: 10
  eta_min: 1.5e-4

data:
  loader:
    batch_size: 16
    eval_batch_size: 10
    num_workers: 16
    pin_memory: true
    persistent_workers: true

model:
  student:
    variant: t
    pretrained: imagenet
    dropout: 0.1
  teacher:
    variant: tiny
