# @package _global_
defaults:
  - override /data/dataset: imagenet100
  - override /model/teacher: null
  - override /model/student: resnet152_imagenet
  - override /loss: ce
  - override /optimizer: SGD
  - override /scheduler: warmup_cosine

name: imagenet100_scratch_resnet152
device: cuda
deterministic: True

clearml:
  enabled: False
  tags: [imagenet-100, teacher, scratch, resnet152]

trainer:
  epochs: 1200
  amp: true

optimizer:
  lr: 0.2
  weight_decay: 1e-4

scheduler:
  warmup_epochs: 10
  start_factor: 0.01
  end_factor: 1.0
  eta_min: 1.0e-6

loss:
  label_smoothing: 0.1

data:
  loader:
    batch_size: 512
    num_workers: 16
    persistent_workers: true