# @package _global_
defaults:
  - override /data/dataset: imagenet100
  - override /data/transform/train: tinyvit_transform
  - override /data/transform/eval: tinyvit_transform
  - override /model/teacher: tiny_vit
  - override /model/student: shufflenet_v2_x0_5
  - override /loss: hinton_kd
  - override /optimizer: SGD
  - override /scheduler: warmup_cosine

name: imagenet100_vanilla-KD_vit21m_to_shufflenetv2_x0_5
device: cuda
deterministic: false

clearml:
  enabled: True
  tags: [imagenet-100, vanilla-KD, tiny-ViT 21m, shuffleNet v2 x0.5]
  output_uri: false

trainer:
  epochs: 100
  amp: true

optimizer:
  lr: 0.2
  momentum: 0.9
  weight_decay: 4.0e-5
  nesterov: true

scheduler:
  warmup_epochs: 5
  start_factor: 0.01
  end_factor: 1.0
  eta_min: 1.0e-5

loss:
  temperature: 4.0
  alpha: 0.9

data:
  loader:
    batch_size: 256
    num_workers: 32
    persistent_workers: true

model:
  teacher:
    model_name: tiny_vit_21m_224
    checkpoint_path: data/weights/tiny-ViT21m-finetune-on-imagenet100/best.pt