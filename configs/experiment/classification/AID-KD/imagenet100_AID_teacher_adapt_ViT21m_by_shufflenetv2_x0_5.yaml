# @package _global_
defaults:
  - override /data/dataset: imagenet100
  - override /data/transform/train: tinyvit_transform
  - override /data/transform/eval: tinyvit_transform
  # student в коде — это обучаемый большой учитель.
  - override /model/student: timm_model_for_classification
  # teacher в коде — это замороженный предварительный ученик.
  - override /model/teacher: torchvision_model_for_classification
  - override /loss: aid_teacher_adaptation
  - override /optimizer: SGD
  - override /scheduler: warmup_cosine

name: imagenet100_AID_teacher_adapt_vit21m_by_shufflenetv2_x0_5

device: cuda
deterministic: false

clearml:
  enabled: true
  tags: [imagenet-100, AID, adaptation, tiny ViT 21m, shuffleNet v2 x0.5]
  output_uri: false

trainer:
  epochs: 20
  amp: true

optimizer:
  lr: 0.005
  momentum: 0.9
  weight_decay: 4.0e-5
  nesterov: true

scheduler:
  warmup_epochs: 1
  start_factor: 0.1
  end_factor: 1.0
  eta_min: 1.0e-6

loss:
  temperature: 4.0
  beta: 1.0

data:
  loader:
    batch_size: 256
    num_workers: 32
    persistent_workers: true

model:
  student:
    model_name: tiny_vit_21m_224
    checkpoint_path: data/weights/tiny-ViT21m-finetune-on-imagenet100/best.pt

  teacher:
    model_name: shufflenet_v2_x0_5
    checkpoint_path: data/weights/shufflenetv2-x0_5-on-imagenet100/best.pt