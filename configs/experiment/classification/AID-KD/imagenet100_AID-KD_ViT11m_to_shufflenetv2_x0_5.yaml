# @package _global_
defaults:
  - override /data/dataset: imagenet100
  - override /data/transform/train: tinyvit_transform
  - override /data/transform/eval: tinyvit_transform
  - override /model/teacher: timm_model_for_classification
  - override /model/student: torchvision_model_for_classification
  - override /loss: hinton_kd
  - override /optimizer: SGD
  - override /scheduler: warmup_cosine

name: imagenet100_AID-KD_vit11m_to_shufflenetv2_x0_5
device: cuda
deterministic: false

clearml:
  enabled: True
  tags: [imagenet-100, AID-KD, tiny-ViT 11m, shuffleNet v2 x0.5]
  output_uri: false

trainer:
  epochs: 100
  amp: true

optimizer:
  lr: 0.2
  momentum: 0.9
  weight_decay: 4.0e-5
  nesterov: true

scheduler:
  warmup_epochs: 5
  start_factor: 0.01
  end_factor: 1.0
  eta_min: 1.0e-5

loss:
  temperature: 4.0
  alpha: 0.9

data:
  loader:
    batch_size: 256
    num_workers: 32
    persistent_workers: true

model:
  student:
    model_name: shufflenet_v2_x0_5
  teacher:
    model_name: tiny_vit_11m_224
    checkpoint_path: data/weights/tiny-ViT11m-adapted-by-shufflenetv2-x0_5/best.pt