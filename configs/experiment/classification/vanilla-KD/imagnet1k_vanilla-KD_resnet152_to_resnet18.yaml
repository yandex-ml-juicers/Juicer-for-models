# @package _global_
defaults:
  - override /data/dataset: imagenet1k
  - override /model/teacher: torchvision_model_for_classification
  - override /model/student: torchvision_model_for_classification
  - override /loss: hinton_kd
  - override /optimizer: adamw
  - override /scheduler: warmup_cosine

name: imagenet1k_vanilla-KD_resnet152_to_resnet18
device: cuda
deterministic: false

clearml:
  enabled: True
  tags: [imagenet-1k, vanilla-KD, resnet152, resnet18]

trainer:
  epochs: 20
  amp: true

optimizer:
  lr: 1.0e-4
  weight_decay: 0.02

scheduler:
  warmup_epochs: 5
  start_factor: 0.01
  end_factor: 1.0
  eta_min: 1.0e-6

loss:
  temperature: 4.0
  alpha: 0.9

model:
  teacher:
    model_name: resnet152
    weights: ResNet152_Weights.IMAGENET1K_V2
  student:
    model_name: resnet18