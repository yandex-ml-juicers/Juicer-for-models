# @package _global_
# Второй этап дистилляции yolov8n: ученик стартует не с COCO-претрейна, а с
# весов, полученных дистилляцией от RT-DETR-R50 (cityscapes_YOLOKD_rtdetr_to_
# yolov8n, прогон yolokd_rtdetr_v8n_lf275, best mAP 0.2981 на эпохе 96).
# Учитель на этом этапе другой — LW-DETR-small, потому что CLoCKDistill-лосс
# завязан на его encoder memory и decoder (см. src/losses/clockdistill_loss.py),
# для RT-DETR такого адаптера в проекте нет.
#
# От cityscapes_CLoCKDistill_lwdetr_small_to_yolov8n.yaml отличается только
# именем, тегами и model.student.checkpoint_path. Гиперпараметры намеренно
# не тронуты: иначе прирост от двухэтапной схемы будет неотличим от эффекта
# другого рецепта обучения.
defaults:
  - override /data/dataset: cityscapes
  - override /data/transform/train: cityscapes_transform_for_yolo
  - override /data/transform/eval: cityscapes_transform_for_yolo
  - override /model/teacher: lwdetr_clockdistill
  - override /model/student: yolo
  - override /loss: clockdistill
  - override /optimizer: yolo_sgd
  - override /scheduler: warmup_cosine
  - override /prediction_postprocessors: yolov8n

name: cityscapes_CLoCKDistill_LWDETR_small_to_yolov8n_after_rtdetr
device: cuda
deterministic: false

task_type: "detection"

clearml:
  enabled: True
  tags: [cityscapes, CLoCKDistill, LW-DETR-small, yolov8n, stage2, from-rtdetr-kd]
  output_uri: false
  plots:
    # 0 — Debug Samples не отправляются вовсе.
    debug_samples: 0
    # 0/не указано — зонд вклада компонентов лосса в градиент выключен;
    # N>0 — считается раз в N шагов внутри эпохи (график grad_contribution
    # в ClearML). См. GradientContributionTracker в src/utils/metrics.py.
    grad_contrib_every_n_steps: 50

trainer:
  epochs: 100
  amp: true
  grad_clip_norm: 10.0

optimizer:
  lr: 0.01
  momentum: 0.937
  weight_decay: 0.005

scheduler:
  warmup_epochs: 5
  start_factor: 0.01
  end_factor: 1.0
  eta_min: 1.0e-4

data:
  dataset:
    image_size: [512, 1024]
    targets_format_mode: "yolov8n"
    build:
      label_offset: 0
  loader:
    batch_size: 32
    num_workers: 16
    persistent_workers: true
    pin_memory: true

model:
  student:
    # Явно, хотя это и дефолт configs/model/student/yolo.yaml: конфиг привязан
    # к чекпоинту конкретной архитектуры, и молчаливая смена дефолта фабрики
    # уронила бы strict-загрузку весов ниже.
    model_name: yolov8n
    # checkpoint_path полностью заменяет загрузку через weights (см. докстринг
    # src.models.factory.yolo): COCO-претрейн не тянется вовсе.
    weights: null
    checkpoint_path: "data/weights/yolov8n-rtdetr-kd/best.pt"
    backbone_dropout: 0.02
    neck_dropout: 0.0
    bbox_dropout: 0.0
    cls_dropout: 0.0
  teacher:
    checkpoint_path: "data/weights/lw-detr-small/best.pt"

loss:
  num_classes: 8

  student_feature_key: model.21
  teacher_feature_key: model.model.backbone.projector

  student_channels: 256
  teacher_channels: 256
  d_model: 256

  lambda_det: 0.72
  lambda_lcmd: 0.31
  lambda_tcld: 3.58

  alpha: 1686.5
  beta: 3.373

  lambda_cls: 1.0
  lambda_l1: 5.0
  lambda_giou: 2.0

  temperature: 2.0

  teacher_has_no_object: false

  max_target_queries: 300

  eps: 1.0e-6
