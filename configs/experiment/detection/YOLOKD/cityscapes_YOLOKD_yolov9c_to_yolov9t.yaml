# @package _global_
defaults:
  - override /data/dataset: cityscapes
  - override /data/transform/train: cityscapes_transform_for_yolo
  - override /data/transform/eval: cityscapes_transform_for_yolo
  - override /model/teacher: yolo_teacher
  - override /model/student: yolo
  - override /loss: yolo_kd
  - override /optimizer: SGD
  - override /scheduler: warmup_cosine
  - override /prediction_postprocessors: yolov8n

name: cityscapes_YOLOKD_yolov9c_to_yolov9t
device: cuda
deterministic: false

task_type: "detection"

clearml:
  enabled: True
  tags: [cityscapes, YOLOKD, yolov9c, yolov9t]
  output_uri: false
  plots:
    # 0 — Debug Samples не отправляются вовсе.
    debug_samples: 0
    # 0/не указано — зонд вклада компонентов лосса в градиент выключен;
    # N>0 — считается раз в N шагов внутри эпохи (график grad_contribution
    # в ClearML). См. GradientContributionTracker в src/utils/metrics.py.
    grad_contrib_every_n_steps: 50

trainer:
  epochs: 100
  amp: true
  grad_clip_norm: 10.0

optimizer:
  lr: 0.02
  momentum: 0.937
  weight_decay: 0.0005

scheduler:
  warmup_epochs: 5
  start_factor: 0.01
  end_factor: 1.0
  eta_min: 1.0e-4

data:
  dataset:
    image_size: [512, 1024]
    targets_format_mode: "yolov8n"
    build:
      label_offset: 0
  loader:
    batch_size: 32
    num_workers: 16
    persistent_workers: true
    pin_memory: true

model:
  student:
    model_name: yolov9t
    weights: null
    backbone_dropout: 0.0
    neck_dropout: 0.0
    bbox_dropout: 0.0
    cls_dropout: 0.0

loss:
  num_classes: 8

  # model.21 — последний neck-блок перед Detect (P5/stride32). Проверено
  # прогоном обеих моделей: у yolov9c та же структура module list (23 слоя,
  # тот же индекс), что и у yolov9t, — 128 каналов у student, 512 у teacher.
  student_feature_key: model.21
  teacher_feature_key: model.21

  student_channels: 128
  teacher_channels: 512

  temperature: 2.0

  # 80/20 — по ФАКТИЧЕСКОМУ вкладу в градиент (train_gradshare_*), а не по
  # номиналу λ; сверка сделана по прогону
  # cityscapes_YOLOKD_yolov9c_to_yolov9t_coco_8020 (16 эпох), как и обещал
  # прежний комментарий «стартовая точка».
  # Наивные 0.8 / 0.0984 / 0.0984 / 0.0033 давали gradshare 99.99 / 0.01:
  # det идёт с ultralytics-множителем batch_size (сырая ‖∇L_det‖ ≈ 283 на
  # эпохе 1), а KD-компоненты — обычные средние (‖∇L_logit‖ ≈ 0.028,
  # ‖∇L_box‖ ≈ 0.20, ‖∇L_feat‖ ≈ 0.12), разрыв ~2500x.
  # Весь KD-блок отмасштабирован одним множителем 732 (геом. среднее
  # отношения det/KD за 16 эпох), внутренние пропорции logit:box:feat
  # сохранены. Отношение падает по ходу обучения, поэтому доля KD растёт
  # с ~7% на старте до ~32% к 16-й эпохе, проходя 20% примерно в середине.
  lambda_det: 0.8
  lambda_logit: 72.05
  lambda_box: 72.05
  lambda_feat: 2.416
