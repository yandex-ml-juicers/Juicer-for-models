# @package _global_
defaults:
  - override /data/dataset: cityscapes
  - override /data/transform/train: cityscapes_transform_for_yolo
  - override /data/transform/eval: cityscapes_transform_for_yolo
  - override /model/teacher: rtdetr
  - override /model/student: yolo
  - override /loss: yolo_kd
  - override /optimizer: yolo_sgd
  - override /scheduler: warmup_cosine
  - override /prediction_postprocessors: yolov8n

name: cityscapes_YOLOKD_rtdetr_to_yolov9t
device: cuda
deterministic: false

task_type: "detection"

clearml:
  enabled: True
  tags: [cityscapes, YOLOKD, rtdetr-r50, yolov9t]
  output_uri: false
  plots:
    debug_samples: 0
    grad_contrib_every_n_steps: 50

trainer:
  epochs: 100
  amp: true
  grad_clip_norm: 10.0

optimizer:
  lr: 0.02
  momentum: 0.937
  weight_decay: 0.0005

scheduler:
  warmup_epochs: 5
  start_factor: 0.01
  end_factor: 1.0
  eta_min: 1.0e-4

data:
  dataset:
    image_size: [512, 1024]
    targets_format_mode: "yolov8n"
    build:
      label_offset: 0
  loader:
    # Проверено: связка RT-DETR(no_grad)+YOLOv9t(train) на 32 — 5.93GB пик,
    # запас большой (учитель не считает backward/denoising).
    batch_size: 32
    num_workers: 16
    persistent_workers: true
    pin_memory: true

model:
  student:
    model_name: yolov9t
    weights: null
    backbone_dropout: 0.0
    neck_dropout: 0.0
    bbox_dropout: 0.0
    cls_dropout: 0.0

loss:
  num_classes: 8

  student_feature_key: model.21
  teacher_feature_key: model.encoder_input_proj.2

  student_channels: 128
  teacher_channels: 256

  temperature: 2.0

  # RT-DETR — query-based учитель: logit/box КД по позиции anchor'а
  # невозможны (нет dense-сетки, см. докстринг YOLOKDLoss), поэтому 0 —
  # используется только feature-KD (lambda_feat) поверх det.
  #
  # 80/20 — по ФАКТИЧЕСКОМУ вкладу в градиент (train_gradshare_*), а не по
  # номиналу λ. Наивные 0.8/0.2 давали gradshare det/feat = 99.99/0.01:
  # det идёт с ultralytics-множителем batch_size (сырая ‖∇L_det‖ ≈ 259 на
  # эпохе 1), а feat — обычное среднее (‖∇L_feat‖ ≈ 7.8), разрыв ~2000x.
  # lambda_feat подобран из прогона cityscapes_YOLOKD_rtdetr_to_yolov9t_coco_8020
  # по геометрическому среднему отношения det/feat за 15 эпох (783).
  # Отношение падает по ходу обучения, поэтому доля feat растёт с ~9% на
  # старте до ~26% к 15-й эпохе, проходя 20% примерно в середине.
  lambda_det: 0.8
  lambda_logit: 0.0
  lambda_box: 0.0
  lambda_feat: 2.584
