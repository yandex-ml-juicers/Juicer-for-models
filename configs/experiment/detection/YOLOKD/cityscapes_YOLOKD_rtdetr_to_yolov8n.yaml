# @package _global_
# Копия cityscapes_YOLOKD_rtdetr_to_yolov9t с заменой студента на yolov8n.
# Отличается ровно двумя вещами: model_name и student_channels — у yolov8n
# на model.21 стоит C2f с 256 каналами против RepNCSPELAN4 со 128 у yolov9t
# (замерено прогоном моделей, не взято из документации).
defaults:
  - override /data/dataset: cityscapes
  - override /data/transform/train: cityscapes_transform_for_yolo
  - override /data/transform/eval: cityscapes_transform_for_yolo
  - override /model/teacher: rtdetr
  - override /model/student: yolo
  - override /loss: yolo_kd
  - override /optimizer: yolo_sgd
  - override /scheduler: warmup_cosine
  - override /prediction_postprocessors: yolov8n

name: cityscapes_YOLOKD_rtdetr_to_yolov8n
device: cuda
deterministic: false

task_type: "detection"

clearml:
  enabled: True
  tags: [cityscapes, YOLOKD, rtdetr-r50, yolov8n]
  output_uri: false
  plots:
    debug_samples: 0
    grad_contrib_every_n_steps: 50

trainer:
  epochs: 100
  amp: true
  grad_clip_norm: 10.0

optimizer:
  lr: 0.02
  momentum: 0.937
  weight_decay: 0.0005

scheduler:
  warmup_epochs: 5
  start_factor: 0.01
  end_factor: 1.0
  eta_min: 1.0e-4

data:
  dataset:
    image_size: [512, 1024]
    targets_format_mode: "yolov8n"
    build:
      label_offset: 0
  loader:
    batch_size: 32
    num_workers: 16
    persistent_workers: true
    pin_memory: true

model:
  student:
    model_name: yolov8n
    weights: null
    backbone_dropout: 0.0
    neck_dropout: 0.0
    bbox_dropout: 0.0
    cls_dropout: 0.0

loss:
  num_classes: 8

  student_feature_key: model.21
  teacher_feature_key: model.encoder_input_proj.2
  student_channels: 256
  teacher_channels: 256

  temperature: 2.0

  # Дистилляция только по фичам: головы RT-DETR живут в другом пространстве
  # выходов, чем YOLO-голова, поэтому логиты и боксы не переносятся.
  #
  # 80/20 — по ФАКТИЧЕСКОМУ вкладу в градиент (train_gradshare_*), а не по
  # номиналу λ. Наивные 0.8/0.2 давали gradshare det/feat = 99.99/0.01:
  # det идёт с ultralytics-множителем batch_size (сырая ‖∇L_det‖ ≈ 267 на
  # эпохе 1), а feat — обычное среднее (‖∇L_feat‖ ≈ 8.1), разрыв ~2000x.
  # lambda_feat подобран из прогона cityscapes_YOLOKD_rtdetr_to_yolov8n_coco_8020
  # по геометрическому среднему отношения det/feat за 17 эпох (955).
  # Отношение падает по ходу обучения, поэтому доля feat растёт с ~11% на
  # старте до ~23% к 17-й эпохе, проходя 20% примерно в середине.
  lambda_det: 0.8
  lambda_logit: 0.0
  lambda_box: 0.0
  lambda_feat: 3.15
