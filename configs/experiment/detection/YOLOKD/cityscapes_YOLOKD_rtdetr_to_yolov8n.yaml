# @package _global_
# Копия cityscapes_YOLOKD_rtdetr_to_yolov9t с заменой студента на yolov8n.
# Отличается ровно двумя вещами: model_name и student_channels — у yolov8n
# на model.21 стоит C2f с 256 каналами против RepNCSPELAN4 со 128 у yolov9t
# (замерено прогоном моделей, не взято из документации).
defaults:
  - override /data/dataset: cityscapes
  - override /data/transform/train: cityscapes_transform_for_yolo
  - override /data/transform/eval: cityscapes_transform_for_yolo
  - override /model/teacher: rtdetr
  - override /model/student: yolo
  - override /loss: yolo_kd
  - override /optimizer: yolo_sgd
  - override /scheduler: warmup_cosine
  - override /prediction_postprocessors: yolov8n

name: cityscapes_YOLOKD_rtdetr_to_yolov8n
device: cuda
deterministic: false

task_type: "detection"

clearml:
  enabled: True
  tags: [cityscapes, YOLOKD, rtdetr-r50, yolov8n]
  output_uri: false
  plots:
    debug_samples: 0
    grad_contrib_every_n_steps: 50

trainer:
  epochs: 100
  amp: true
  grad_clip_norm: 10.0

optimizer:
  lr: 0.02
  momentum: 0.937
  weight_decay: 0.0005

scheduler:
  warmup_epochs: 5
  start_factor: 0.01
  end_factor: 1.0
  eta_min: 1.0e-4

data:
  dataset:
    image_size: [512, 1024]
    targets_format_mode: "yolov8n"
    build:
      label_offset: 0
  loader:
    batch_size: 32
    num_workers: 16
    persistent_workers: true
    pin_memory: true

model:
  student:
    model_name: yolov8n
    weights: null
    backbone_dropout: 0.0
    neck_dropout: 0.0
    bbox_dropout: 0.0
    cls_dropout: 0.0

loss:
  num_classes: 8

  student_feature_key: model.21
  teacher_feature_key: model.encoder_input_proj.2
  student_channels: 256
  teacher_channels: 256

  temperature: 2.0

  # Дистилляция только по фичам: головы RT-DETR живут в другом пространстве
  # выходов, чем YOLO-голова, поэтому логиты и боксы не переносятся.
  #
  # 80/20 — по ФАКТИЧЕСКОМУ вкладу в градиент (train_gradshare_*), а не по
  # номиналу λ. Наивные 0.8/0.2 давали gradshare det/feat = 99.99/0.01:
  # det идёт с ultralytics-множителем batch_size (сырая ‖∇L_det‖ ≈ 267 на
  # эпохе 1), а feat — обычное среднее, разрыв по сырым нормам ~1000-2000x.
  #
  # Условие "feat = 20% градиента" это λ_feat·‖∇feat‖ = 0.25·λ_det·‖∇det‖,
  # то есть lambda_feat = 0.25 · lambda_det · (‖∇det‖/‖∇feat‖). Прежнее
  # значение 3.15 выводилось из верно замеренного отношения (955 по 17
  # эпохам прогона *_coco_8020), но с потерянным множителем ~60 — замер это
  # подтвердил: feat давал 0.20% градиента вместо 20%.
  #
  # 275 — geo-mean нужной λ по первым 6 эпохам прогона yolokd_rtdetr_v8n
  # (λ_текущая · 0.25 · gradnorm_det/gradnorm_feat = 402, 329, 270, 234,
  # 218, 238). При фиксированной λ доля feat не постоянна: ‖∇det‖ падает
  # быстрее ‖∇feat‖ (215 -> 57 за 6 эпох), поэтому доля стартует с ~15% и
  # дальше растёт. Ровно 80/20 на всём обучении дала бы только динамическая
  # перенормировка λ по замеренным нормам — этого в тренере нет.
  lambda_det: 0.8
  lambda_logit: 0.0
  lambda_box: 0.0
  lambda_feat: 275.0
