# @package _global_
defaults:
  - override /data/dataset: cityscapes
  - override /data/transform/train: cityscapes_transform_for_yolo
  - override /data/transform/eval: cityscapes_transform_for_yolo
  - override /model/teacher: null
  - override /model/student: yolo
  - override /loss: yolo
  - override /optimizer: yolo_sgd
  - override /scheduler: warmup_cosine
  - override /prediction_postprocessors: yolov8n

name: cityscapes_finetune_yolov9c
device: cuda
deterministic: false

task_type: "detection"

clearml:
  enabled: True
  tags: [cityscapes, teacher, finetune, yolov9c]
  output_uri: false
  plots:
    # 0 — Debug Samples не отправляются вовсе.
    debug_samples: 0
    # 0/не указано — зонд вклада компонентов лосса в градиент выключен;
    # N>0 — считается раз в N шагов внутри эпохи (график grad_contribution
    # в ClearML). См. GradientContributionTracker в src/utils/metrics.py.
    grad_contrib_every_n_steps: 50

trainer:
  epochs: 100
  amp: true
  # Как и для yolov9t/yolov9s: YOLO-лосс умножает лосс на batch_size, поэтому
  # реальная норма градиента - десятки-сотни, а не единицы. Клиппинг
  # 1.0 нормировал бы каждый шаг и эффективно гасил lr сильнее косинуса.
  grad_clip_norm: 10.0
  track_train_map: true

optimizer:
  # Тот же рецепт ultralytics: lr0 0.01 при номинальном батче 64, здесь
  # батч 32 -> 0.01 * 64 / 32 = 0.02. Формула не зависит от размера модели,
  # только от batch_size.
  lr: 0.01
  momentum: 0.937
  # Прогон yolov9c_20260818 переобучался: train mAP 0.48 против eval 0.34 к
  # 50-й эпохе на 2975 картинках. 0.0005 — дефолт ultralytics для батча 64,
  # при нашем батче 32 их же формула дала бы 0.00025, то есть регуляризации
  # было вдвое меньше номинала.
  weight_decay: 0.005

scheduler:
  warmup_epochs: 5
  start_factor: 0.01
  end_factor: 1.0
  eta_min: 2.0e-4

data:
  dataset:
    image_size: [512, 1024]
    targets_format_mode: "yolov8n"
    normalize: null
    build:
      label_offset: 0
  loader:
    batch_size: 32
    num_workers: 16
    persistent_workers: true
    pin_memory: true

model:
  student:
    model_name: yolov9c
    # null — докачать канонический COCO-претрейн (yolov9c.pt) в data/weights.
    weights: null
    # У yolov9-семейства вместо C2f/SPPF стоят RepNCSPELAN4/ELAN1/SPPELAN —
    # фабрика теперь вставляет dropout и в них (выходные свёртки cv4/cv5),
    # так что все четыре ручки рабочие. Голова Detect общая с yolov8.
    backbone_dropout: 0.0
    neck_dropout: 0.0
    # Переобучение сидит в классификации, а не в регрессии бокса — поэтому
    # cls выше bbox; значения — дефолты самой фабрики yolo().
    bbox_dropout: 0.0
    cls_dropout: 0.0
