# @package _global_
defaults:
  - override /data/dataset: cityscapes
  - override /data/transform/train: base_cityscapes_transform
  - override /data/transform/eval: base_cityscapes_transform
  - override /model/teacher: null
  - override /model/student: lwdetr
  - override /loss: lwdetr_small_loss
  - override /optimizer: lwdetr_adamw
  - override /scheduler: warmup_cosine
  - override /prediction_postprocessors: lwdetr

name: cityscapes_finetune_LWDETR_small
device: cuda
deterministic: false

task_type: "detection"

clearml:
  enabled: True
  tags: [cityscapes, teacher, finetune, LW-DETR-small]
  output_uri: false

trainer:
  epochs: 80
  amp: true

optimizer:
  lr: 1.0e-3
  lr_encoder: 1.5e-3
  weight_decay: 0.05
  fused: true

scheduler:
  warmup_epochs: 5
  start_factor: 0.01
  end_factor: 1.0
  eta_min: 1.0e-4

data:
  dataset:
    image_size: [512, 1024]
    targets_format_mode: "lw-detr-small"
    build:
      label_offset: 0
  loader:
    batch_size: 16
    num_workers: 8
    persistent_workers: true
    pin_memory: true

model:
  student:
    dropout: 0.3
    attention_dropout: 0.4
    activation_dropout: 0.3
    backbone_dropout: 0.1