# @package _global_
defaults:
  - override /data/dataset: cityscapes
  - override /data/transform/train: cityscapes_transform_for_yolo
  - override /data/transform/eval: cityscapes_transform_for_yolo
  - override /model/teacher: null
  - override /model/student: yolo
  - override /loss: yolo
  - override /optimizer: yolo_sgd
  - override /scheduler: warmup_cosine
  - override /prediction_postprocessors: yolov8n

name: cityscapes_finetune_yolov9s
device: cuda
deterministic: false

task_type: "detection"

clearml:
  enabled: True
  tags: [cityscapes, student, finetune, yolov9s]
  output_uri: false
  plots:
    debug_samples: 0
    grad_contrib_every_n_steps: 50

trainer:
  epochs: 100
  amp: true
  grad_clip_norm: 10.0
  track_train_map: true

optimizer:
  lr: 0.02
  momentum: 0.937
  weight_decay: 0.0005

scheduler:
  warmup_epochs: 3
  start_factor: 0.01
  end_factor: 1.0
  eta_min: 2.0e-4

data:
  dataset:
    image_size: [512, 1024]
    targets_format_mode: "yolov8n"
    normalize: null
    build:
      label_offset: 0
  loader:
    batch_size: 32
    num_workers: 16
    persistent_workers: true
    pin_memory: true

model:
  student:
    model_name: yolov9s
    # null — yolov9s.pt подтверждён в GITHUB_ASSETS_NAMES ultralytics,
    # автоскачается (в отличие от yolov6n).
    weights: null
    # RepNCSPELAN4/ELAN1/SPPELAN — как у yolov9c/t. Проверено эмпирически:
    # backbone/neck дропаут no-op (нет C2f/SPPF), bbox/cls через Detect
    # реально применяются, но здесь оба и так 0.
    backbone_dropout: 0.0
    neck_dropout: 0.0
    bbox_dropout: 0.0
    cls_dropout: 0.0
