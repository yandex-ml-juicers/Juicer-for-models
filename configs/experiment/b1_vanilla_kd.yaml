# @package _global_
# дистилляция по Хинтону ResNet-56 -> ResNet-20 на CIFAR-10.
defaults:
  - override /data/dataset: cifar10
  - override /data/loader: base_loader
  - override /data/transform: base_transform
  - override /model/teacher: resnet56_cifar
  - override /model/student: resnet20_cifar
  - override /loss: hinton_kd
  - override /optimizer: adam
  - override /scheduler: cosine

name: b1_resnet56_to_resnet20_kd


clearml:
  enabled: True
  tags: [baseline, kd, b1]

trainer:
  epochs: 20
  amp: false

loss:
  temperature: 4.0
  alpha: 0.9

optimizer:
  lr: 1.0e-3

data:
  dataset:
    normalize:
      std: [0.2023, 0.1994, 0.2010]
  loader:
    batch_size: 128
    num_workers: 2
