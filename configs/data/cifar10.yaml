dataset:
  _target_: src.data.datasets.cifar10
  root: data/raw
  download: true
  # Если оригинальный хост недоступен, можно подставить зеркало
  # (архив должен быть бит-в-бит тем же, md5 проверяется):
  # mirror_url: https://data.brainchip.com/dataset-mirror/cifar10/cifar-10-python.tar.gz
  mirror_url: null

num_classes: 10
image_size: null  # null = нативные 32x32; целое число включает Resize

normalize:
  mean: [0.4914, 0.4822, 0.4465]
  std: [0.2470, 0.2435, 0.2616]

loader:
  batch_size: 128
  num_workers: 2
  pin_memory: true
  persistent_workers: false
