# Усиленный train-рецепт Cityscapes ДЛЯ ДИСТИЛЛЯЦИИ.
#
# Отличие от cityscapes_seg_strong_transform ровно одно: teacher_skips.
# Размытие и стирание остаются включёнными для ученика, но кадр, по которому
# учитель считает таргеты, до них не доходит.
#
# Зачем. Учитель (SegFormer-B2, дообученный на чистом Cityscapes) на размытых
# и частично стёртых кадрах проседает — и дистиллирует ученику уже не знание,
# а собственную растерянность. Без teacher_skips выбор был бы бинарным:
# либо выключить регуляризацию (и ученик переобучается), либо испортить
# таргеты. Здесь ученик видит сильную аугментацию, учитель — слабую;
# геометрия у обоих общая, поэтому логиты и карты признаков учителя
# по-прежнему выровнены с ученическими попиксельно.
#
# Это стандартная схема «weak-to-strong» из полу-supervised сегментации,
# только источник таргета не EMA-модель, а обычный учитель.
#
# Какие аугментации оставить учителю, а какие убрать — меряется скриптом
# scripts/probe_teacher_augmentations.py (SegFormer-B2, кропы 512x1024 того
# же рецепта, аугментации с p=1):
#
#              12 кадров x2    30 кадров x3
#   clean         0.718           0.699
#   jitter       -0.059          +0.014
#   blur         -0.045          +0.004
#   erasing      -0.076          -0.032
#
# Читать это так: на малой выборке оценка шумит на ±0.05, и доверять ей
# нельзя. Устойчиво просаживает учителя только СТИРАНИЕ; jitter и blur на
# большей выборке уходят в ноль.
#
# В списке всё равно все три, и вот почему: спрятать аугментацию от учителя
# не может ухудшить таргет — учитель обучен как раз на чистых кадрах, — а
# стоит это только лишней работы даталоадеру, прогон учителя остаётся один.
# Если эта работа дорога (мало воркеров, узкий диск), оставьте
# teacher_skips: [erasing] — по замеру это единственное, что обязательно.
_target_: src.data.transforms.build_segmentation_transform_train
mean: ${data.dataset.normalize.mean}
std: ${data.dataset.normalize.std}
crop_size: ${data.dataset.crop_size}
scale_range: ${data.dataset.scale_range}
ignore_index: ${data.dataset.ignore_index}

color_jitter: 0.4
color_jitter_p: 0.8
hue: 0.03
hflip_p: 0.5

cat_max_ratio: 0.75

blur_p: 0.3
blur_kernel_size: 5
blur_sigma: [0.1, 2.0]

random_erasing_p: 0.3
random_erasing_scale: [0.02, 0.15]
random_erasing_ratio: [0.3, 3.3]
# Стирание идёт после Normalize, поэтому 0.0 — это средний цвет датасета.
random_erasing_value: 0.0
random_erasing_erases_labels: false

# Аугментации, которых НЕ видит учитель: jitter | blur | erasing.
# Пустой список — учитель смотрит на тот же кадр, что и ученик (и датасет
# отдаёт обычную пару, без второго вида).
teacher_skips: [jitter, blur, erasing]
