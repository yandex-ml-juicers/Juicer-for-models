# Синтетические данные формы CIFAR-10: смоук-тесты пайплайна без сети и GPU.
#   python scripts/train.py data=fake '~model/teacher' loss=ce trainer.epochs=1
dataset:
  _target_: src.data.datasets.fake_cifar_like
  train_size: 512
  eval_size: 256
  num_classes: ${data.num_classes}

num_classes: 10
image_size: null

normalize:
  mean: [0.4914, 0.4822, 0.4465]
  std: [0.2470, 0.2435, 0.2616]

loader:
  batch_size: 64
  num_workers: 0
  pin_memory: false
  persistent_workers: false
