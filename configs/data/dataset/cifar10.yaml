# вынесли в отдельный блок build, потому что
# instantiate забирает все соседние ключи узла
# а num classes cifar10 не принимает
build:
  _target_: src.data.datasets.cifar10
  root: data/raw
  download: true # если сети нет ставим false - обращаемся только к локальному датасету
  # mirror_url: https://data.brainchip.com/dataset-mirror/cifar10/cifar-10-python.tar.gz
  mirror_url: https://data.brainchip.com/dataset-mirror/cifar10/cifar-10-python.tar.gz

image_size: null # null = 32*32
num_classes: 10

normalize:
  mean: [0.4914, 0.4822, 0.4465]
  std: [0.2470, 0.2435, 0.2616]

