build:
  _target_: src.data.datasets.cityscapes
  root: data/raw/cityscapes/leftImg8bit
  annotation_dir: data/raw/cityscapes/annotations

num_classes: 8
image_size: [1024, 2048]

normalize:
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

loader:
  batch_size: 64
  num_workers: 16
  pin_memory: true
  persistent_workers: true