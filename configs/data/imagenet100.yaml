dataset:
  _target_: src.data.datasets.imagenet
  root: data/raw
  repo_path: clane9/imagenet-100
  download: true

num_classes: 100
image_size: 224

normalize:
  mean: [0.4914, 0.4822, 0.4465]
  std: [0.2470, 0.2435, 0.2616]

loader:
  batch_size: 512
  num_workers: 32
  pin_memory: true
  persistent_workers: true