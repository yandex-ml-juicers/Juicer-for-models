# Параметры распределённого запуска (DDP).

backend: auto  # auto -> nccl на CUDA, gloo на CPU; либо явно nccl/gloo

# Предел ожидания в коллективных операциях
# Если GPU не отвечает больше timeout_minutes -> ловим ошибку
#
# Считать надо не по шагу обучения, а по самой долгой операции под барьером.
# Самая долгая — main_process_first в train.py: неглавные ранки стоят на
# barrier(), пока главный качает веса и строит датасеты. На холодном кэше
# (SegFormer с HF, энкодеры timm) это легко больше 10 минут, и тогда падают
# ВСЕ ранки, кроме главного, — с таймаутом коллективной операции, по которому
# причину не угадать. 30 минут покрывают закачку с запасом.
timeout_minutes: 30


# Нужно, только если часть параметров модели не участвует в forward
# (ветвления внутри модели). классические модели не требуют этого флага.
# при активации флага сильно теряем скорость (но исключаем дедлок). Включать осознанно!
find_unused_parameters: false

# Синхронизация буферов (running_mean/var у BatchNorm) перед каждым forward.
# Буферы обновляются статистикой (после прогона через себя), а не градиентом. Поэтому под усреднение
# градиентов не попадают и синхронизируются отдельно.
# после всего прогона статистики отправляются с GPU:0 на все остальные (затираем другие)
# Если поставим false - получим небольшое ускорение, но математика пострадает. Включать осознанно!
broadcast_buffers: true

# convert_sync_batchnorm: заменяет обычные слои на SyncBatchNorm
# Если true, карты будут делать all_reduce прямо внутри forward, чтобы считать 
# честную глобальную статистику по всему кластеру. Сильное замедление при true! 
# Включать только если батч на ОДНУ карту слишком мал (например, 2-4 картинки).
sync_bn: false
