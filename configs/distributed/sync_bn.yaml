defaults:
  - default

# То же, что default, но с честной глобальной статистикой BatchNorm.
#
# Зачем. batch_size в конфиге глобальный и делится между картами, поэтому
# на сегментации батч на ОДНУ карту получается маленьким: при batch_size=8
# на двух картах это 4 кропа, на четырёх — 2. Обычный BatchNorm считает
# running_mean/var по своему куску, и на таких размерах статистика шумная.
# broadcast_buffers это не лечит: он лишь копирует буферы rank 0 остальным,
# то есть раздаёт всем ту же оценку по 4 кропам.
#
# sync_bn=true заставляет карты складывать статистику через all_reduce прямо
# внутри forward — ровно ту же, что была бы на одной карте с полным батчом.
# Это и есть условие, при котором многокарточный запуск не теряет в метриках.
#
# Цена — скорость: несколько десятков дополнительных коллективных операций
# на каждый forward. При однопроцессном запуске флаг не делает ничего.
#
# Альтернатива, если скорость важнее: оставить default и поднять глобальный
# batch_size так, чтобы на карту приходилось хотя бы 8 объектов.
sync_bn: true
