# Корневой конфиг. Композиция: каждая группа defaults — независимая ось
# эксперимента; готовые сочетания лежат в configs/experiment/*.yaml.
#
#  пример запуска конкретного эксперимента:
#      python scripts/train.py experiment=b2_feature_kd
#      python scripts/train.py loss=hinton_kd loss.temperature=8 trainer.epochs=5
defaults:
  - _self_
  - data: cifar10
  - model/teacher: resnet56_cifar
  - model/student: resnet20_cifar
  - loss: hinton_kd
  - optimizer: adam
  - scheduler: cosine
  - trainer: default
  - experiment: null

# Имя запуска: подпапка в outputs/, задаётся экспериментом.
name: default

seed: 42
# Бит-в-бит воспроизводимость (только детерминированные CUDA-ядра, ~10-20% медленнее).
deterministic: true
# Аварийный клапан: warning вместо RuntimeError для операций без
# детерминированной реализации. Включать осознанно.
deterministic_warn_only: false

device: auto  # auto | cuda | cuda:N | cpu

# Путь к чекпоинту для scripts/eval.py (относительно корня репозитория).
ckpt_path: null

# Трекинг в ClearML (нужен настроенный clearml.conf или CLEARML_* переменные,
# см. base_docs.md). Выключен по умолчанию, чтобы смоуки/CI работали оффлайн:
#   python scripts/train.py experiment=b1_vanilla_kd clearml.enabled=true
clearml:
  enabled: false
  project: Juicer-for-models
  tags: []  # эксперименты добавляют свои, см. configs/experiment/*.yaml

hydra:
  run:
    dir: outputs/${name}/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: multirun/${name}/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}
  job:
    # Не менять cwd процесса: пути к данным остаются относительно корня репо,
    # артефакты пишутся в output_dir через HydraConfig (см. scripts/train.py).
    chdir: false
