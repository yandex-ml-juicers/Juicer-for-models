defaults:
  - _self_
  - data/dataset: cifar10
  - data/loader: base_loader
  - data/transform/train: base_transform
  - data/transform/eval: base_transform
  - model/teacher: resnet56_cifar
  - model/student: resnet20_cifar
  - loss: hinton_kd
  - optimizer: adam
  - scheduler: cosine
  - trainer: default
  # Mixup/CutMix. null — выключено; варианты — в configs/augment/.
  # Аугментации одного примера задаются в data/transform/*, здесь только
  # то, что смешивает РАЗНЫЕ примеры батча.
  - augment: null
  - distributed: default
  - experiment: null

name: default # имя таски

# Воспроизводимость
seed: 42
deterministic: true # сохраняется ассоциативность
# если нет детерменированной реализации при false ловим ошибку, при true запускаемся
deterministic_warn_only: false # лучше держать false

device: auto  # auto | cuda | cuda:N | cpu

ckpt_path: null
# Только для scripts/eval.py: какую модель конфига оценивать — student или
# teacher. Учителю ckpt_path не нужен, он собирается уже с весами.
eval_slot: student
task_type: 'classification' # Доступны опции ['classification', 'detection', 'segmentation']

model:
  # Мультимасштабный прогон УЧИТЕЛЯ (только сегментация): таргеты считаются
  # усреднением предсказаний по нескольким масштабам и отражению. null —
  # обычный одиночный forward. Стоит по лишнему прогону учителя на масштаб.
  #   teacher_inference: {scales: [0.75, 1.0, 1.25], flip: true}
  teacher_inference: null

# Группы параметров оптимизатора: свой lr и weight decay энкодеру, декодеру
# и обучаемым частям лосса. null — одна группа на всё, как раньше.
# Все значения — МНОЖИТЕЛИ от optimizer.lr / optimizer.weight_decay, поэтому
# перебор lr не ломает соотношение частей. Подробности — в
# src/training/param_groups.py и docs/param_groups.md.
#   param_groups:
#     encoder_lr_mult: 0.1          # предобученному энкодеру — десятую долю lr
#     no_decay_on_norm_and_bias: true
param_groups: null

# Расписание весов слагаемых лосса по эпохам; null — веса постоянны.
# Ключ — путь к весу внутри лосса, значение — правило (см.
# src/training/loss_schedule.py):
#   loss_schedule:
#     hint_weight: {schedule: linear, start: 0.7, end: 0.0, start_epoch: 120}
loss_schedule: null

# Трекинг в ClearML
# Выключен по умолчанию, чтобы тесты работали оффлайн
clearml:
  enabled: False
  project: Juicer-for-models # проект
  tags: []  # теги для фильтрации экспериментов
  # Дополнительные метрики, которые надо ПОСЧИТАТЬ (базовые логируются всегда):
  # 'precision'/'recall'/'f1' — confusion matrix на train;
  # 'KL_divergence'/'agreement_rate' — схожесть с учителем.
  scalars: []
  # Раздел Plots: per-class IoU, матрица ошибок, распределения норм и KL.
  # Строятся из уже накопленных агрегатов, поэтому почти бесплатны;
  # платная часть — только сравнение с учителем (probe_*).
  plots:
    enabled: true
    every_n_epochs: 5   # период тяжёлых графиков (матрица ошибок); последняя эпоха всегда
    probe_batches: 20   # сколько батчей за эпоху идёт на сравнение ученика с учителем
    probe_pixels: 8192  # сколько пикселей берётся с каждого такого батча
    # Debug Samples: полоса [кадр | разметка | предсказание | ошибки] по
    # фиксированным кадрам валидации. Срез до обучения уходит всегда (iteration 0).
    debug_samples: 4          # сколько кадров показывать (0 — выключить картинки)
    debug_every_n_epochs: 10  # период отправки; последняя эпоха всегда
    debug_width: 512          # ширина одной панели, px (кадр 1024x2048 иначе весит мегабайты)
  reuse_last_task_id: False # перезаписывать ли таску с таким же именем
  continue_last_task: False # подхватывать ли предыдущий ID и продолжать логирование
  output_uri: True # складывать ли артефакты/модели и если не куда-то базово, то url
  auto_connect_frameworks: {"pytorch": False,} # авто-перехват фреймворков
  auto_connect_arg_parser: False # авто-перехват аргументов из argparse

# Настройка самой Hydra (подробнее описано в документации)
hydra:
  # запуск одного эксперимента
  run:
    dir: outputs/${name}/${oc.env:JUICER_RUN_ID,${oc.env:TORCHELASTIC_RUN_ID,${now:%Y-%m-%d_%H-%M-%S}}}
  
  # мультизапуск с флагом -m  
  sweep:
    # создаётся главная папка
    dir: multirun/${name}/${now:%Y-%m-%d_%H-%M-%S}
    # подпапки
    subdir: ${hydra.job.num}
  
  job:
    # физически меняет текущую рабочую директорию (подробнее смотри в документации)
    chdir: True
