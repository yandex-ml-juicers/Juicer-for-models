# CutMix для семантической сегментации.
#
# mixup_alpha=0 намеренно: при линейном смешивании двух городских сцен
# получается полупрозрачное наложение, которого в природе не бывает,
# и таргет приходится размазывать интерполяцией лосса. CutMix же переносит
# кусок маски вместе с куском изображения — таргет остаётся ТОЧНЫМ, а картинка
# состоит из настоящих пикселей. Это тот вариант, который работает на плотных
# задачах (и на нём же построен CutMix-консистентность в полу-supervised
# сегментации).
#
# Стык двух сцен внутри кадра — не баг, а суть метода: модель учится
# сегментировать по локальному контексту, а не по глобальной композиции кадра.
#
# При дистилляции учитель прогоняется по той же склеенной картинке, что и
# ученик (тренер смешивает батч ДО forward'а учителя), поэтому soft-таргеты
# согласованы с входом.
_target_: src.data.batch_augment.MixupCutmix

mixup_alpha: 0.0
cutmix_alpha: 1.0

# Половина батчей идёт без склейки — чтобы модель видела и целые сцены тоже.
prob: 0.5
switch_prob: 1.0
