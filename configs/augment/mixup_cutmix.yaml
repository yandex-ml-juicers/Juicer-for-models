# Mixup + CutMix для классификации — стандартный рецепт timm/DeiT.
#
# Применяется к уже собранному батчу в тренере, не в трансформе датасета.
# На валидации не применяется никогда.
#
# Обучение с mixup требует БОЛЬШЕ эпох: регуляризация сильная, и на коротком
# расписании (< 100 эпох) она чаще вредит, чем помогает. На 20 эпохах включать
# не стоит.
_target_: src.data.batch_augment.MixupCutmix

# Beta(alpha, alpha) для веса смеси. 0.2 — слабое смешивание (DeiT/timm),
# 0.8-1.0 — сильное (исходная статья mixup на ImageNet).
mixup_alpha: 0.2

# 1.0 даёт равномерное распределение площади вырезаемого прямоугольника —
# значение из статьи CutMix.
cutmix_alpha: 1.0

# Доля батчей, к которым вообще применяется смешивание.
prob: 0.5

# Если смешивание применено — с какой вероятностью это будет CutMix, а не Mixup.
switch_prob: 0.5
