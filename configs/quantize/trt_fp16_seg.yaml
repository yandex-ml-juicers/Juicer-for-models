# PTQ fp32 -> fp16 для сегментации в полном разрешении (Cityscapes 1024x2048).
#
# Отличия от trt_fp16 продиктованы разрешением, а не задачей: один кадр
# Cityscapes — это 6 МБ входа и сотни мегабайт активаций, поэтому всё, что в
# классификации меряется десятками, здесь измеряется единицами.
#
#   CUDA_VISIBLE_DEVICES=2 python scripts/quantize.py quantize=trt_fp16_seg \
#       quantize.source_run=outputs/<папка запуска> \
#       ckpt_path=outputs/<папка запуска>/best.pt \
#       data.loader.eval_batch_size=1
defaults:
  - base
  - _self_

backend: tensorrt
precision: fp16

export:
  batch_size: 1
  # Статический вход. На инференсе сегментация идёт покадрово, а динамический
  # батч заставил бы TensorRT подбирать тактики под диапазон размеров и стоил
  # бы производительности на единственном размере, который реально нужен.
  dynamic_axes: []

build:
  # 2 ГиБ не хватает на свёртки в полном разрешении: билдер молча отбросит
  # быстрые тактики, которым не хватило места, и движок выйдет медленнее.
  workspace_gb: 8

validate:
  # Батч из одного кадра 1024x2048 — это [1, 19, 1024, 2048] логитов на выходе,
  # то есть 40M чисел. Десяти кадров хватает, чтобы поймать переполнение fp16.
  compare_batches: 10
  # Порог строже, чем в классификации: здесь argmax считается по ПИКСЕЛЯМ, а их
  # миллионы, и большинство тривиальны (дорога, небо). 1% несовпадения — это
  # уже катастрофа, а не допуск.
  min_agreement: 0.999
  # Метрика — mIoU. 0.5 п.п. на Cityscapes заметны.
  max_metric_drop: 0.005

benchmark:
  batch_sizes: [1]
  # Прогон одного кадра — десятки миллисекунд, а не единицы: 200 итераций
  # здесь стоили бы минут вместо секунд.
  warmup: 20
  iters: 100
  modes: [compute, e2e]
  baseline: torch_fp32
