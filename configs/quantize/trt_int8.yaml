# PTQ fp32 -> int8 через TensorRT с калибровкой по реальным данным.
#
#   python scripts/quantize.py experiment=<...> ckpt_path=<...> quantize=trt_int8
#
# Стадия calibrate здесь перестаёт быть пропуском: она собирает
# data/deploy/<model_id>/calib/samples.npy, а сборка по нему подбирает
# масштабы квантования и складывает их в scales_<алгоритм>.cache.
#
# ---------------------------------------------------------------------------
# ЧЕГО ЖДАТЬ НА V100 (sm_70)
#
#   FP32  ~14 TFLOPS   CUDA-ядра
#   FP16  ~112 TFLOPS  тензорные ядра
#   INT8  ~62 TOPS     DP4A на CUDA-ядрах
#
# Целочисленных тензорных ядер у Volta нет — они появились в Turing (sm_75).
# По арифметике int8 здесь ВДВОЕ МЕДЛЕННЕЕ fp16, и выигрыш возможен только на
# слоях, упирающихся в память. Ускорения сверх trt_fp16 на этой карте ждать
# не стоит; сжатие весов вчетверо — стоит.
#
# На Turing/Ampere и новее картина обратная: там int8-тензорные ядра дают
# вдвое больше fp16. Решение об int8 принимается по ЦЕЛЕВОЙ карте, а не по
# той, на которой удобно экспериментировать.
# ---------------------------------------------------------------------------
defaults:
  - base
  - _self_

backend: tensorrt
precision: int8

validate:
  # Пороги мягче, чем у fp16, и это не поблажка, а другой режим. fp16 хранит
  # 10 бит мантиссы и почти всегда бесплатен по качеству; int8 — это 256
  # уровней на весь диапазон тензора, и потеря в доли процента здесь
  # ожидаема, а не является признаком поломки. Что осталось строгим:
  # проверка на NaN/Inf — поломку движка эти пороги не пропустят.
  max_metric_drop: 0.02   # 2 п.п. вместо 0.5
  min_agreement: 0.95     # против 0.99 у fp16
