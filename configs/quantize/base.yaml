# Общая часть всех рецептов квантизации. Сама по себе не выбирается:
# quantize=base соберётся, но соберёт fp32-эталон без движка.
#
# Ключи 1:1 соответствуют аргументам функций в src/quantization/.

# Список стадий оркестратора. calibrate — no-op для fp16, стоит в списке
# заранее: под int8 в него встанет сбор статистик, и порядок менять не придётся.
stages: [export, calibrate, build, validate, benchmark]

# Пропускать стадию, если её артефакт уже лежит на месте и собран из того же
# исходника (сверяется по sha256 в паспорте). Пересборка движка — это минуты.
reuse: true

# Откуда берутся веса и архитектура.
#   source_run: папка обучающего запуска — из её .hydra/config.yaml берутся
#               model/data. Самый честный вариант: конфиг эксперимента в
#               configs/ мог уехать вперёд с момента обучения.
#   null      : архитектура берётся из текущего конфига (experiment=...),
#               веса — из ckpt_path в корне конфига.
source_run: null

# Куда складывать тяжёлые артефакты. Папка запуска Hydra остаётся для логов
# и отчётов, .onnx и .engine переиспользуются между запусками.
artifacts_dir: data/deploy
# Идентификатор модели = имя подпапки в artifacts_dir. По умолчанию — имя запуска.
model_id: ${name}

# Бэкенд, на котором считается КАНДИДАТ (эталон всегда torch fp32).
backend: torch          # torch | onnxruntime | tensorrt
precision: fp16         # fp32 | fp16
# Провайдеры onnxruntime. null — CPUExecutionProvider. Задавать явно:
# при недоступном провайдере ORT молча уходит на CPU, и "замер GPU"
# оказывается замером CPU без единого предупреждения.
providers: null

# Раскладка NHWC для torch-раннеров (только они, у движков она своя).
# Тензорные ядра читают данные в NHWC, и в NCHW cuDNN транспонирует их сам на
# каждом слое — для свёрточных сетей в fp16 это часто и есть разница между
# "ускорения почти нет" и "ускорение вдвое". Включается СРАЗУ ОБОИМ раннерам,
# иначе эффект точности смешается с эффектом раскладки. Выключено по
# умолчанию: это отдельный эксперимент, а не бесплатное улучшение.
channels_last: false

export:
  opset: 18             # < 18 несовместим с dynamo-экспортером
  dynamo: true          # false — легаси TorchScript-путь
  optimize: true
  external_data: null   # null — решить по размеру весов (один файл, пока влезает)
  parity_atol: 1.0e-4   # L0: допуск расхождения torch и onnxruntime
  # Выключать только осознанно: у модели со случайностью внутри forward
  # (SegNeXt инициализирует базисы NMF через torch.rand) L0 падает всегда,
  # потому что torch и onnxruntime тянут РАЗНЫЕ случайные числа. Тогда
  # экспорт возможен, но за целостность графа больше никто не отвечает.
  verify: true
  # Откуда взять образец входа для трассировки:
  #   loader — первый батч eval-лоадера (реальные данные, реальные формы)
  #   random — шум по data.dataset.image_size
  sample_source: loader
  batch_size: 8         # размер образца; он же opt-точка профиля TensorRT
  # Динамические оси входа. Пустой список — полностью статический вход
  # (быстрее всего в TensorRT). Батч почти всегда стоит оставить динамическим:
  # иначе на каждый размер батча нужен свой движок.
  dynamic_axes:
    - {axis: 0, name: batch, min: 1, max: 64}

build:
  workspace_gb: 2       # лимит рабочей памяти билдера; карта общая
  timing_cache: true    # кэш замеров тактик: быстрее и стабильнее пересборка
  opt_batch: null       # null — оптимизировать под максимум профиля
  verbose: false        # true поднимает INFO-поток TensorRT в лог
  # Хранить в движке разбор слоёв. Без этого TensorRT кладёт только их имена,
  # и ответить "что реально ушло в fp16" нечем. На тактики не влияет.
  detailed_layers: true
  # Слои, которые обязаны остаться в fp32. Шаблоны работают ЯКОРЯМИ: берётся
  # диапазон от первого совпадения до последнего, и всё между ними уходит в
  # fp32 — потому что опасна цепочка, а не отдельная операция.
  #
  # Нужно там, где модель сама просит точность выше (`autocast(enabled=False)`,
  # `x.float()`): до движка эта просьба не доезжает. Пример — NMF-разложение
  # в SegNeXt, оно в fp16 расходится в NaN:
  #   quantize.build.fp32_layers='[bmm]'
  #
  # Каждый шаблон обязан найти хотя бы один слой, иначе сборка падает: молча
  # отключившаяся защита хуже её отсутствия.
  fp32_layers: []
  # Запас по краям диапазона, в слоях. Опасны и границы: каст результата
  # обратно в fp16 стоит сразу за последним якорем, и переполнение там даёт
  # Inf. Имя у такого служебного слоя не подобрать — отступаем от якоря.
  fp32_margin: 0

validate:
  compare_batches: 20   # L1: сколько батчей сравнивать с fp32
  # Прогнать fp32-эталон дважды и сравнить с самим собой. Для детерминированной
  # модели это ноль; если не ноль — расхождение fp16 не с чем сопоставлять,
  # пока случайность не убрана из модели. Стоит один лишний проход по
  # compare_batches батчам.
  measure_noise_floor: true
  limit_eval_batches: null  # L2: null — вся eval-выборка
  max_metric_drop: 0.005    # допустимая потеря accuracy/mIoU в долях (0.005 = 0.5 п.п.)
  min_agreement: 0.99       # минимальная доля совпавших с fp32 предсказаний
  strict: true          # true — ненулевой код возврата, если приёмка не прошла

benchmark:
  batch_sizes: [1, 8, 32]
  warmup: 50
  iters: 200
  modes: [compute, e2e] # compute — только карта; e2e — с копированием с хоста
  baseline: torch_fp32  # относительно чего считать ускорение
