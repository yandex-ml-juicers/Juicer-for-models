# Какие GPU можно занимать (значения для CUDA_VISIBLE_DEVICES).
available_gpus: [0, 1, 2, 3]

default_gpus_per_job: 1

experiments:
  # Запуск на default_gpus_per_job
  - "experiment=baseline/b1_resnet56_to_resnet20_kd clearml.enabled=false trainer.epochs=3 trainer.limit_train_batches=4 trainer.limit_eval_batches=3"

  # Запуск на gpus количестве
  - args: "experiment=baseline/b1_resnet56_to_resnet20_kd clearml.enabled=false trainer.epochs=5 trainer.limit_train_batches=8 trainer.limit_eval_batches=3"
    gpus: 2

  # Запуск на конкретных GPU перечисленных в devices: []
  - args: "experiment=baseline/b1_resnet56_to_resnet20_kd clearml.enabled=false trainer.epochs=5 trainer.limit_train_batches=8 trainer.limit_eval_batches=3"
    devices: [0, 1]

# при распределённом запуске batch_size - ГЛОБАЛЬНЫЙ